description: כנפי עוף מבושלות ברוטב קרמל-חמוץ מתוק ואז צלויות לקבלת צריבה מבריקה ודביקה.
descriptionEn: Chicken wings simmered in a sweet-sour caramel sauce, then broiled until lacquered and sticky.
prepTime: 20
cookTime: 55
servings: 8
difficulty: easy
source: "Oren Giron"
featured: true
