steps:
  - items:
      - instruction: מנקים ומחצים את הכנפיים. מניחים על מגש ומסירים שאריות נוצות.
        instructionEn: Clean and halve the wings. Place on a tray and remove any feather remnants.
      - instruction: בסיר רחב יוצרים קרמל כהה מהסוכר. מוסיפים חומץ ואז את כל שאר חומרי הרוטב - מביאים לרתיחה.
        instructionEn: >-
          In a wide pot, make a dark caramel from the sugar. Add vinegar then the remaining sauce ingredients and bring
          to a boil.
      - instruction: מוסיפים כנפיים ומבשלים על להבה בינונית-נמוכה 20 דקות.
        instructionEn: Add wings and cook over medium-low heat for 20 minutes.
        timerMinutes: 20
      - instruction: הופכים וממשיכים עוד 20 דקות.
        instructionEn: Flip, then cook 20 more minutes.
        timerMinutes: 20
      - instruction: מוציאים את הכנפיים ומצמצמים את הרוטב לסירופ.
        instructionEn: Remove the wings and reduce the sauce to a syrup.
      - instruction: מסדרים כנפיים בשכבה אחת על תבנית ויוצקים רוטב מעל. צולים בתנור 220° כ-15 דקות עד לצריבה.
        instructionEn: >-
          Arrange wings in a single layer on a baking tray, pour sauce over. Broil at 220°C for about 15 minutes until
          caramelized.
        timerMinutes: 15
        tip: הכנפיים בשיא הטעם כשהרוטב ממש מקורמל ודביק - אל תוציאו לפני.
        tipEn: The wings are at their best when the sauce is truly caramelized and sticky - don't pull them early.
      - instruction: מגישים עם שומשום קלוי מעל.
        instructionEn: Serve with toasted sesame seeds sprinkled on top.
