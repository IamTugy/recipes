steps:
  - title: ""
    items:
      - instruction: >-
          ממיסים את השוקולד, השמן והחמאה בשיטת בן-מארי (מניחים על הכיריים סיר גדול ללא מכסה עם מים רותחים, מעליו מניחים
          סיר קטן עם המצרכים ומערבבים עד המסה)מערבבים את הביצים והסוכר בקערה עד קבלת תערובת חלקה, מוסיפים את תערובת
          השוקולד. מוסיפים את הקמח, מערבבים.
        instructionEn: >-
          Melt the chocolate, oil and butter using the bain-marie method (place a large lidless pot with boiling water
          on the stove, place a small pot with the ingredients on top of it and mix until smooth) mix the eggs and sugar
          in a bowl until a smooth mixture is obtained, add the chocolate mixture. Add the flour, mix.
      - instruction: >-
          מוסיפים את המרשמלו.מעבירים לתבניות, ואופים בחום של 170 מעלות 20 דקות או עד שקיסם הננעץ בעוגה יוצא עם פירורים
          לחים.לציפוי:מניחים את השוקולד בקערה.מחממים שמנת לסף רתיחה ויוצקים אל השוקולד.
        instructionEn: >-
          Add the marshmallows. Transfer to pans, and bake at 170 degrees for 20 minutes or until a toothpick inserted
          into the cake comes out with moist crumbs. For the coating: place the chocolate in a bowl. Heat the cream to
          the point of boiling and pour into the chocolate.
      - instruction: מערבבים להמסה ומצננים 4 שעות.מעבירים לקערת מיקסר ומקציפים לקרם יציב.
        instructionEn: Stir to melt and cool for 4 hours. Transfer to a mixer bowl and whip to a firm cream.
      - instruction: מזלפים על גבי הקאפקייק הצוננים, מעטרים בפניני שוקולד.מצננים ומגישים.
        instructionEn: Drizzle on top of the cooled cupcakes, decorate with chocolate pearls. Cool and serve.
