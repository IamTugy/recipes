steps:
  - title: ""
    items:
      - instruction: >-
          שוטפים ומייבשים את עלי המאכל היטב.לנוגטין: בתנור שחומם מראש לחום נמוך (160 מעלות) קולים את כל הזרעים במשך 10
          דקות.יוצקים את המים, הסוכר והסילאן לסיר ומביאים לרתיחה.
        instructionEn: >-
          Wash and dry the edible leaves well. For the nougatine: in a preheated oven to low heat (160 degrees) toast
          all the seeds for 10 minutes. Pour the water, sugar and silane into a pot and bring to a boil.
        timerMinutes: 10
      - instruction: מבשלים עד לקבלת קרמל בהיר.
        instructionEn: Cook until you get a light caramel.
      - instruction: מוסיפים את הזרעים שקלינו והתבלינים ומערבבים בזריזות.
        instructionEn: Add the seeds we cleaned and the spices and mix quickly.
      - instruction: מעבירים למשטח משומן או על משטח סיליקון ומשטחים בזריזות לעלה דק.
        instructionEn: Transfer to an oiled surface or on a silicone surface and quickly flatten into a thin sheet.
      - instruction: מצננים.
        instructionEn: cooling
      - instruction: >-
          שוברים את משטח הזרעונים המקורמל או קוצצים לפיסות קטנות ושומרים בכלי אטום. לרוטב: מכניסים את כל חומרי הרוטב
          לקנקן וטוחנים בעזרת מוט בלנדר, עד לקבלת תערובת אחידה. להגשה: מסדרים בכלי הגשה את העלים, מזליפים מעל את הרוטב
          ומפזרים את פיסות הנוגטין.
        instructionEn: >-
          Break the caramelized surface of the seeds or chop into small pieces and keep in an airtight container. For
          the sauce: put all the ingredients of the sauce in a jug and grind with the help of a blender until a uniform
          mixture is obtained. To serve: arrange the leaves in a serving dish, pour the sauce on top and scatter the
          nougat pieces.
