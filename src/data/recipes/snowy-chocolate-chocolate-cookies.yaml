ingredients:
  - group: ""
    items:
      - amount: 120
        unit: g
        name: חמאה רכה
        nameEn: Soft butter
      - amount: 100
        unit: g
        name: סוכר חום כהה
        nameEn: dark brown sugar
      - amount: 20
        unit: g
        name: דבש
        nameEn: honey
      - amount: 2
        unit: g
        name: מלחכפית משחת וניל
        nameEn: A spoonful of vanilla paste
      - amount: 2
        unit: ""
        name: ביצים
        nameEn: eggs
      - amount: 120
        unit: g
        name: קמח כוסמין או חיטה מלאה
        nameEn: Spelled flour or whole wheat
      - amount: 60
        unit: g
        name: אבקת קקאו
        nameEn: cocoa powder
      - amount: 10
        unit: g
        name: אבקת אפייה
        nameEn: baking powder
      - amount: 160
        unit: g
        name: שוקולד מריר, קצוץ גס
        nameEn: Dark chocolate, coarsely chopped
  - group: לציפוי
    items:
