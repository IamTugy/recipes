steps:
  - title: ""
    items:
      - instruction: >-
          מכינים בסיס פקאן וקוקוס: מחממים תנור ל-160 מעלות ומרפדים תבנית תנור בנייר אפייה. במיקסר עם וו גיטרה מעבדים את
          כל החומרים לבצק. מרדדים את הבצק למלבן בעובי של כ-3 מ"מ ומצננים מעט במקפיא. אופים את הבסיס במשך כ-16 דקות עד
          הזהבה.
        instructionEn: >-
          Prepare a pecan and coconut base: heat the oven to 160 degrees and line an oven tray with baking paper. In a
          mixer with a guitar hook, process all the ingredients into a dough. Roll the dough into a rectangle about 3 mm
          thick and cool a little in the freezer. Bake the base for about 16 minutes until golden.
        timerMinutes: 16
      - instruction: >-
          מיד כשמוציאים מהתנור קורצים 2 בסיסים בקוטר 16 ס"מ. מכינים דקואז פיסטוק: מגבירים את חום התנור ל-180 מעלות.
          מקציפים חלבונים עם סוכר אינברטי ומנפים את אבקת הסוכר, הקמח והפיסטוקים הטחונים. מקפלים את האבקות לתוך הקציפה
          בעדינות עד שמתקבלת תערובת אחידה.
        instructionEn: >-
          As soon as you take it out of the oven, cut out 2 bases with a diameter of 16 cm. Make a pistachio decoase:
          increase the oven heat to 180 degrees. Beat egg whites with invert sugar and sift the powdered sugar, flour
          and ground pistachios. Gently fold the powders into the whipped cream until a uniform mixture is obtained.
      - instruction: >-
          מזלפים את הדקואז מעל בסיסי הפקאן הפריכים ואופים במשך כ-15 דקות. מצננים ומשחררים מהתבניות. מכינים את המוס:
          מרתיחים את מחיות הפרי.
        instructionEn: >-
          Sprinkle the decoase over the crispy pecan bases and bake for about 15 minutes. Cool and release from the
          molds. Prepare the mousse: boil the fruit juices.
        timerMinutes: 15
      - instruction: >-
          בקערה טורפים יחד חלמונים, סוכר וקורנפלור.יוצקים ממיץ הפירות הרותח אל תוך תערובת החלמונים בהדרגה, תוך כדי
          טריפה.
        instructionEn: >-
          In a bowl, whisk together egg yolks, sugar and cornflour. Pour the boiling fruit juice into the egg yolk
          mixture gradually, while whisking.
      - instruction: מחזירים את התערובת לסיר ומביאים לרתיחה תוך כדי טריפה נמרצת.
        instructionEn: Return the mixture to the pot and bring to a boil while whisking vigorously.
      - instruction: מסירים מהאש ומוסיפים את החמאה, הרום והג'לטין.
        instructionEn: Remove from the heat and add the butter, rum and gelatin.
      - instruction: מעבירים את הקרם לקערת מיקסר עם וו גיטרה ומערבלים עד שהוא מגיע לטמפרטורת החדר.
        instructionEn: Transfer the cream to a mixer bowl with a guitar hook and mix until it reaches room temperature.
      - instruction: מקפלים את השמנת המתוקה לתוך הקרם הקר עד שמתקבל מוס אחיד.
        instructionEn: Fold the sweet cream into the cold cream until a uniform mousse is obtained.
      - instruction: >-
          יוצקים את המוס בין שתי התבניות (קוטר 18). מניחים מעל המוס את בסיסי העוגה האפויים בלחיצה קלה, כך שבסיס העוגה
          יותאם לגובה המוס. מקפיאים את העוגות במשך 6 שעות לפחות. מכינים זיגוג: מרתיחים מיץ פסיפלורה, מים וסוכר.
        instructionEn: >-
          Pour the mousse between the two molds (diameter 18). Place the baked cake bases on top of the mousse, pressing
          lightly, so that the cake base is adjusted to the height of the mousse. Freeze the cakes for at least 6 hours.
          Prepare glaze: boil passion fruit juice, water and sugar.
        timerMinutes: 360
      - instruction: מסירים מהאש ומוסיפים שוקולד לבן וג'לטין.
        instructionEn: Remove from heat and add white chocolate and gelatin.
      - instruction: >-
          מערבבים היטב, מסננים ומצננים לטמפרטורת הגוף.הרכבה וציפוי: משחררים את העוגות הקפואות מהתבניות או הרינגים
          ומניחים על גבי רשת.
        instructionEn: >-
          Mix well, filter and cool to body temperature. Assembly and coating: release the frozen cakes from the molds
          or rings and place on a wire rack.
      - instruction: יוצקים את הזיגוג על גבי העוגה, כך שיצפה את כל החלק העליון והשוליים.מעבירים לצלחת הגשה ומקשטים.
        instructionEn: >-
          Pour the glaze on top of the cake, so that it covers the entire top and edges. Transfer to a serving plate and
          decorate.
