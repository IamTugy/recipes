steps:
  - title: ""
    items:
      - instruction: לאקלר- מרתיחים חלב, חמאה, סוכר ומלח.
        instructionEn: Lacquer - boil milk, butter, sugar and salt.
      - instruction: מוסיפים בבת אחת את כל כמות הקמח ומערבבים במהירות עד אשר כל הקמח נספג והתערובת מתייבשת.
        instructionEn: Add all the flour at once and mix quickly until all the flour is absorbed and the mixture is dry.
      - instruction: מעבירים למיקסר עם הגיטרה ומערבלים לקירור.מוסיפים את הביצים בהדרגה..
        instructionEn: Transfer to a mixer with the guitar and mix to cool. Add the eggs gradually..
      - instruction: >-
          אם הבצק יציב מידי, מוסיפים מעט חלב. כעת הבצק מוכן לשימוש- מעבירים לשק זילוף מצויד בצנתר משונן רחב (15 מ"מ)
          ומזלפים על תבנית אפייה מרופדת במשטח סיליקון או נייר אפייה אצבעות באורך של 10 ס"מ.
        instructionEn: >-
          If the dough is too firm, add a little milk. Now the dough is ready to use - transfer to a piping bag equipped
          with a wide serrated tube (15 mm) and sprinkle on a baking sheet lined with a silicone surface or baking paper
          fingers 10 cm long.
      - instruction: מחממים תנור לחום של 150 מעלות ואופים שעה ומקפידים לא לפתוח את דלת התנור במהלך האפייה.
        instructionEn: Heat an oven to 150 degrees and bake for an hour, making sure not to open the oven door during baking.
      - instruction: מצננים.לקרם שוקולד למילוי- מרתיחים שמנת מתוקה.
        instructionEn: Cool. For chocolate cream for the filling - boil sweet cream.
      - instruction: מסירים מהאש ומוסיפים שוקולד מריר.
        instructionEn: Remove from heat and add dark chocolate.
      - instruction: מערבבים היטב ומצננים ל-4 שעות.
        instructionEn: Mix well and refrigerate for 4 hours.
        timerMinutes: 240
      - instruction: >-
          מכינים כך גם את קרם השוקולד הלבן, את קליפת התפוז מוסיפים לשמנת). מקציפים בזהירות את הקרמים למרקם יציב ומעבירים
          לשק זילוף.
        instructionEn: >-
          The white chocolate cream is also prepared this way, the orange peel is added to the cream). Carefully whip
          the creams to a firm texture and transfer to a piping bag.
      - instruction: >-
          ממלאים את האקלר- חותכים את חלק האקלר העליון (אם נותרו מעט פיסות בצק, מרוקנים אותם) מזלפים פנימה את קרם השוקולד
          המריר ומעל שכבת קרם שוקולד לבן.
        instructionEn: >-
          Fill the eclair - cut the upper part of the eclair (if there are a few pieces of dough left, empty them)
          sprinkle the dark chocolate cream inside and a layer of white chocolate cream on top.
      - instruction: מניחים את לוח השוקולד המטומפרר ומצננים.
        instructionEn: Place the tempered chocolate board and cool.
