steps:
  - title: ""
    items:
      - instruction: מכניסים את הבטטה, הבצלים, השום, הג'ינג'ר, הקארי והציר לסיר רחב ומביאים לרתיחה.
        instructionEn: Put the sweet potato, onions, garlic, ginger, curry and stock in a wide pot and bring to a boil.
      - instruction: >-
          מנמיכים את הלהבה ומבשלים עד אשר הבטטה רכה.מרסקים את המרק בבלנדר או מעבד מזון למרקם אחיד וחלק.מחזירים את המרק
          לסיר, מוסיפים את חלב/קרם הקוקוס וחמאת הבוטנים ומביאים לרתיחה.
        instructionEn: >-
          Lower the flame and cook until the sweet potato is soft. Puree the soup in a blender or food processor to a
          uniform and smooth texture. Return the soup to the pot, add the coconut milk/cream and the peanut butter and
          bring to a boil.
      - instruction: מתבלים במלח ופלפל לפי הטעם.מבשלים עוד כ-10 דקות ומגישים חם בעיטור בצל ירוק ובוטנים.
        instructionEn: >-
          Season with salt and pepper to taste. Cook for another 10 minutes and serve hot garnished with green onions
          and peanuts.
        timerMinutes: 10
