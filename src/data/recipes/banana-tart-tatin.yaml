steps:
  - title: ""
    items:
      - instruction: במחבת בקוטר 24 ס"מ מכינים מהסוכר קרמל ענברי.
        instructionEn: In a pan with a diameter of 24 cm, make an amber caramel from the sugar.
      - instruction: >-
          מוסיפים את החמאה והמלח ובוחשים (בשלב זה עלולה להיראות התערובת מעט מפורקת וזה בסדר).קולפים את הבננות וחותכים
          לשניים.
        instructionEn: >-
          Add the butter and salt and stir (at this point the mixture may look a little disintegrated and that's fine).
          Peel the bananas and cut them in half.
      - instruction: חוצים כל מחצית לרוחב לשניים.מסדרים את הבננות על שכבת הקרמל שבמחבת בצפיפות.
        instructionEn: Cut each half crosswise in half. Arrange the bananas densely on the caramel layer in the pan.
      - instruction: מוזגים את המים.מחממים תנור לחום של 160 מעלות.מרדדים את הבצק לעלה בעובי 1/2 ס"מ ובקוטר של 26 ס"מ.
        instructionEn: Pour the water. Heat the oven to 160 degrees. Roll the dough into a sheet 1/2 cm thick and 26 cm in diameter.
      - instruction: מניחים מעל וטוחבים את השוליים פנימה.
        instructionEn: Place on top and tuck the edges in.
      - instruction: מבשלים את התכולה מעל להבה בינוינת 10 דקות
        instructionEn: Cook the contents over a moderate flame for 10 minutes
        timerMinutes: 10
      - instruction: ומעבירים לתנור לאפייה של 35 דקות.
        instructionEn: and transfer to the oven to bake for 35 minutes.
        timerMinutes: 35
      - instruction: מצננים מעט והופכים על צלחת הגשה.
        instructionEn: Cool slightly and invert onto a serving plate.
tips: []
