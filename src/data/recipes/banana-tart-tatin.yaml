ingredients:
  - group: ""
    items:
      - amount: 24
        unit: cm
        name: תבנית
        nameEn: 24 cm pan
      - amount: 4
        unit: ""
        name: בננות מוצקות
        nameEn: Solid bananas
      - amount: 300
        unit: g
        name: סוכר
        nameEn: sugar
      - amount: 100
        unit: ""
        name: חמאה חתוכה לקוביות
        nameEn: Butter cut into cubes
      - amount: 2
        unit: g
        name: מלח
        nameEn: salt
      - amount: 70
        unit: g
