steps:
  - title: ""
    items:
      - instruction: >-
          בקערית מערבבים את האריסה עם שמן הזית, זרעי הכמון והשום ומעסים בתערובת את נתחי הדג.לקראסט: במעבד מזון טוחנים
          קלות את מרכיבי הקראסט היבשים.
        instructionEn: >-
          In a bowl, mix the arsenic with the olive oil, cumin seeds and garlic and massage the fish pieces into the
          mixture. For the crust: In a food processor, lightly grind the dry crust ingredients.
      - instruction: "מוסיפים את השמן וטוחנים למרקם חולי רטוב.לקונפי: מערבבים את החומרים ומניחים בסיר."
        instructionEn: "Add the oil and grind to a wet sandy texture. For the confit: mix the ingredients and place in a pot."
      - instruction: מביאים לסף רתיחה ומנמיכים את הלהבה.
        instructionEn: Bring to a boil and lower the flame.
      - instruction: מבשלים עד לקבלת מרקם סמיך כמו ריבה.מניחים את הקראסט על חלקו העליון של הדג ומסדרים על תבנית אפייה.
        instructionEn: >-
          Cook until a thick jam-like texture is obtained. Place the crust on the top of the fish and arrange on a
          baking sheet.
      - instruction: מחממים תנור לחום גבוה (220 מעלות) וצולים את הדג כ־12 דקות, עד לקבלת גוון זהוב.
        instructionEn: Heat an oven to high heat (220 degrees) and roast the fish for about 12 minutes, until golden.
        timerMinutes: 12
      - instruction: מגישים על מצע הקונפי.
        instructionEn: Serve on the bed of confit.
