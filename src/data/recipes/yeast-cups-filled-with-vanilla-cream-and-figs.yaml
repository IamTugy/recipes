steps:
  - title: ""
    items:
      - instruction: לבצק- מכניסים לקערת המיקסר מצויד בוו לישה את כל המרכיבים, למעט החמאה, ולשים 5 דקות.
        instructionEn: >-
          For the dough - put all the ingredients, except the butter, into the bowl of the mixer equipped with a
          kneading hook, and leave for 5 minutes.
        timerMinutes: 5
      - instruction: >-
          מחליפים לוו גיטרה ומוסיפים את החמאה וממשיכים ללוש במהירות גבוהה עוד 3-5 דקות, עד להתנתקות הבצק מהקערה ואיסופו
          סביב וו הגיטרה.
        instructionEn: >-
          Change to a guitar hook and add the butter and continue kneading at high speed for another 3-5 minutes, until
          the dough separates from the bowl and gathers around the guitar hook.
        timerMinutes: 5
      - instruction: מעבירים לקערה ומתפיחים 80%.
        instructionEn: Transfer to a bowl and swell 80%.
      - instruction: מעבירים לצינון של 6 שעות בקירור.לקרם וניל- מביאים לרתיחה את החלב והווניל.
        instructionEn: >-
          Transfer to cool for 6 hours in the refrigerator. For the vanilla cream - bring the milk and vanilla to a
          boil.
        timerMinutes: 360
      - instruction: בנפרד טורפים היטב חלמונים וסוכר.
        instructionEn: Beat egg yolks and sugar separately.
      - instruction: מוסיפים את העמילנים וטורפים לתערובת אחידה.
        instructionEn: Add the starches and beat to a uniform mixture.
      - instruction: משווים טמפרטורה עם החלב הרותח ומחזירים לסיר נקי לבישול תוך כדי בחישה עד לרתיחה טובה.
        instructionEn: >-
          Compare the temperature with the boiling milk and return to a clean cooking pot while stirring until it boils
          well.
      - instruction: מסירים מאש ומצננים.מרדדים את הבצק לעלה מלבני בעובי 4 מ"מ.
        instructionEn: Remove from heat and cool. Roll the dough into a 4 mm thick rectangular sheet.
      - instruction: מחלקים אותו ל-12 ריבועים.
        instructionEn: Divide it into 12 squares.
      - instruction: מניחים כל ריבוע בתוך תבנית שקעים (בנפח של 180 מ"ל- כמו למשל תבנית של מאפינס גדולים) ומרפדים את דפנות השקע.
        instructionEn: >-
          Place each square in a socket mold (with a volume of 180 ml - such as a large muffin mold) and line the sides
          of the socket.
      - instruction: מניחים לתוכו 1/2 גובה של קרם וניל ומניחים מעל 2 חצאי תאנים.
        instructionEn: Place 1/2 the height of vanilla cream in it and place 2 fig halves on top.
      - instruction: >-
          חוזרים על פעולה זו עם יתרת הבצק. מכסים ומניחים להתפחה עד רמה של 80% מנפח המאפה הראשוני. מחממים את התנור לחום
          של 180 מעלות. מברישים את שולי הבצק בביצה טרופה ומפזרים מעט סוכר על גביו. אופים 17 דקות להזהבה עמוקה.
        instructionEn: >-
          Repeat this operation with the rest of the dough. Cover and allow to rise to a level of 80% of the initial
          pastry volume. Heat the oven to 180 degrees. Brush the edges of the dough with a beaten egg and sprinkle a
          little sugar on top. Bake for 17 minutes until deep golden.
        timerMinutes: 17
      - instruction: מצננים ומאבקים באבקת סוכר.
        instructionEn: Cool and dust with powdered sugar.
