steps:
  - title: ""
    items:
      - instruction: לבצק תחתית- מניחים את כל החומרים במיקסר מצויד בוו גיטרה ומעבדים עד קבלת בצק אחיד.
        instructionEn: >-
          For the bottom dough - place all the ingredients in a mixer equipped with a guitar hook and process until you
          get a uniform dough.
      - instruction: מרדדים בין שני ניירות אפייה לעלה בעובי 1/2 ס"מ ומקפיאים ל-20 דקות.
        instructionEn: Roll out between two sheets of baking paper to a 1/2 cm thick sheet and freeze for 20 minutes.
      - instruction: >-
          קורצים עם תבנית האפיה ומעבירים איתה לאפייה בתנור שחומם ל-150 מעלות ל-17 דקות.לשכבת הפאדג'- מעל באן מארי מתיכים
          חמאה ושוקלד.
        instructionEn: >-
          Wink with the baking pan and bake with it in an oven heated to 150 degrees for 17 minutes. For the fudge layer
          - melt butter and chocolate on top of a bain marie.
      - instruction: בקערה נפרדת טורפים סוכר וביצה.
        instructionEn: In a separate bowl, beat sugar and egg.
      - instruction: מוסיפים חלב ואת תערובת השוקולד.
        instructionEn: Add milk and the chocolate mixture.
      - instruction: מוסיפים את יתרת החומרים ובוחשים לאיחוד.
        instructionEn: Add the rest of the ingredients and stir to combine.
      - instruction: יוצקים מעל התחתית האפויה ומחזירים לתנור לעוד 30 דקות אפייה.
        instructionEn: Pour over the baked bottom and return to the oven for another 30 minutes of baking.
      - instruction: באותו החום.
        instructionEn: in the same heat.
      - instruction: מצננים.לגנאש- מתיכים שוקולדים מעל באן מארי.
        instructionEn: Cool. For ganache - melt chocolates over a bain marie.
      - instruction: בנפרד מרתיחים שמנת וגלוקוזה.
        instructionEn: Separately boil cream and glucose.
      - instruction: מחברים את שתי התערובות בשלבים וטוחנים היטב בעזרת בלנדר מוט.
        instructionEn: Combine the two mixtures in stages and grind well with a stick blender.
      - instruction: יוצקים 2/3 מהתערובת על שכבת הפאדג' שבתבנית ומעבירים להקפאה של 3 שעות.
        instructionEn: Pour 2/3 of the mixture on the fudge layer in the mold and freeze for 3 hours.
      - instruction: את יתרת התערובת מצננים ויוצרים ממנה, לאחר התייצבות, כדורי טראפלס במגוון גדלים.
        instructionEn: The rest of the mixture is cooled and, after stabilization, truffle balls of various sizes are formed from it.
      - instruction: מקפיאים.לציפוי- בסיר על להבה גבוהה מכינים מהסוכר קרמל ענברי.
        instructionEn: Freeze. For the coating - in a pot on a high flame, make an amber caramel from the sugar.
      - instruction: בנפרד מביאים לרתיחה את השמנת והחלב.
        instructionEn: Separately, bring the cream and milk to a boil.
      - instruction: בזהירות יוצקים את השמנת והחלב על הקרמל ובוחשים להמסה.
        instructionEn: Carefully pour the cream and milk over the caramel and stir to melt.
      - instruction: יוצקים על השוקולד והג'לטין המרוכך ומסננים.
        instructionEn: Pour over the chocolate and the softened gelatin and filter.
      - instruction: >-
          מצננים לחום של 35 מעלות (קרוב לחום הגוף).משחררים את העוגה הקפואה מהתבנית, מניחים מעל את כדורי הטאפלס ומעבירים
          אל רשת ומזגגים.
        instructionEn: >-
          Cool to a temperature of 35 degrees (close to body temperature). Release the frozen cake from the mold, place
          the taffle balls on top and transfer to a wire rack and glaze.
      - instruction: מניחים לייצוב קל ומעבירים לצלחת הגשה ומפשירים באיטיות בקירור.
        instructionEn: Allow to stabilize slightly and transfer to a serving plate and thaw slowly in the refrigerator.
