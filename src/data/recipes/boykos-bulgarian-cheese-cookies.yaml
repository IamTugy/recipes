steps:
  - title: ""
    items:
      - instruction: מנפים את הקמח והמלח ומניחים במעבד מזון.
        instructionEn: Sift the flour and salt and place in a food processor.
      - instruction: מוסיפים את יתרת החומרים ומעבדים לבצק אחיד.
        instructionEn: Add the rest of the ingredients and process into a uniform dough.
      - instruction: >-
          מצננים במקרר שעה לפחות. מרדדים את הבצק על משטח מקומח, לעלה בעובי 1/2 ס"מ. מברישים את הבצק בביצה הטרופה ומפזרים
          את הציפוי הנבחר. בעזרת כוס או חותכן עוגיות, קורצים מהבצק את הצורה הרצויה, מניחים על תבנית אפייה מרופדת בנייר
          אפיה.
        instructionEn: >-
          Cool in the refrigerator for at least an hour. Roll out the dough on a floured surface, into a sheet 1/2 cm
          thick. Brush the dough with the beaten egg and sprinkle with the chosen coating. Using a glass or a cookie
          cutter, cut the desired shape from the dough, place it on a baking sheet lined with baking paper.
      - instruction: אופים בתנור שחומם ל-160 מעלות, 25-30 דקות.
        instructionEn: Bake in an oven heated to 160 degrees, 25-30 minutes.
      - instruction: מצננים ומגישים.
        instructionEn: Cool and serve.
