steps:
  - items:
      - instruction: בסיר גדול מחממים שמן ומטגנים בצל, שום, כרישה ושורשים עד להזהבה.
        instructionEn: In a large pot, heat oil and sauté onion, garlic, leek and roots until golden.
      - instruction: מוסיפים תבלינים, מערבבים ומטגנים 3 דקות. מוסיפים עגבניות ומבשלים 2 דקות.
        instructionEn: Add spices, stir and fry for 3 minutes. Add tomatoes and cook 2 more minutes.
      - instruction: מוסיפים חומוס, עדשים, מים ותפוח אדמה - מביאים לרתיחה. מבשלים על להבה נמוכה כ-30 דקות.
        instructionEn: Add chickpeas, lentils, water and potato - bring to a boil. Simmer on low heat for about 30 minutes.
        timerMinutes: 30
      - instruction: מדללים קמח בכוס מים ובוחשים לתוך המרק. מבשלים 10 דקות ומערבבים מדי פעם.
        instructionEn: Dissolve flour in a cup of water and stir into the soup. Cook 10 minutes, stirring occasionally.
        timerMinutes: 10
        tip: הסמכה עם קמח נמצ היא הסוד לגוף המרק המאפיין את החרירה.
        tipEn: The flour thickening is the secret to the characteristic body of harira.
      - instruction: מוסיפים עשבי תיבול, אטריות ומלח - מבשלים 10 דקות.
        instructionEn: Add herbs, noodles and salt - cook 10 minutes.
        timerMinutes: 10
      - instruction: מוסיפים מיץ לימון ומבשלים 5 דקות. טועמים ומתקנים תיבול.
        instructionEn: Add lemon juice and cook 5 minutes. Taste and adjust seasoning.
        timerMinutes: 5
tips:
  - ניתן להוסיף נתחי פרגית לגרסה עם בשר.
  - מתאחר בזמן - המרק רק מתעצם בטעמו ביום שאחרי.
tipsEn:
  - Add chicken thigh pieces for a meat version.
  - Better the next day - the flavors deepen overnight.
