steps:
  - title: ""
    items:
      - instruction: מערבבים בקערה את התפוחים עם הסוכר, צימוקים החמאה והוניל.
        instructionEn: Mix the apples with the sugar, raisins, butter and vanilla in a bowl.
      - instruction: מוסיפים פירות יער.· משמנים היטב כלים אישיים בחמאה.
        instructionEn: Add berries. · Grease personal utensils well with butter.
      - instruction: ממלאים עד שני שליש גובה בתערובת התפוחים.· מכינים פירורים- במעבד מזון טוחנים קמח עם שקדים.
        instructionEn: >-
          Fill up to two-thirds of the height with the apple mixture. Make crumbs - grind flour with almonds in a food
          processor.
      - instruction: מוסיפים סוכר וחמאה ומעבדים בפולסים לקבלת פירורים לחים.
        instructionEn: Add sugar and butter and process in pulses to obtain moist crumbs.
      - instruction: מקפיאים 10 דקות ומפזרים את הפירורים מעל הפירות.
        instructionEn: Freeze for 10 minutes and sprinkle the crumbs over the fruit.
        timerMinutes: 10
      - instruction: · מכניסים לאפיה בחום של 180 מעלות כ- 20 דקות או עד שהפירורים מזהיבים.
        instructionEn: Put in the oven at 180 degrees for about 20 minutes or until the crumbs are golden.
        timerMinutes: 20
      - instruction: · מקשטים באבקת סוכר ותלולית קצפת.
        instructionEn: Decorate with powdered sugar and a mound of whipped cream.
