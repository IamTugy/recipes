steps:
  - title: ""
    items:
      - instruction: לסירופ- מביאים את החומרים לתרתיחה ומבשלים כ-3 דקות.
        instructionEn: For the syrup - bring the ingredients to a boil and cook for about 3 minutes.
        timerMinutes: 3
      - instruction: >-
          שומרים חם. למילוי- טוחנים יחד במעבד מזון את כל החומרים לתערובת פירורית גסה. יוצרים צורת גלילים בידיים רטובות.
          פורשיםעלה פילו, מברישים בחמאה מותכת וחוצים לאורך לשנייםץ מניחים בבסיס כל עלה גליל אגוזים ומגלגלים.
        instructionEn: >-
          Keep warm. For the filling - grind all the ingredients together in a food processor into a coarse crumbly
          mixture. Form into rolls with wet hands. Spread a sheet of phyllo, brush with melted butter and cut lengthwise
          in half. Place a walnut roll at the base of each sheet and roll.
      - instruction: >-
          מניחים את הגלילים על מגש אפייה ומברישים בחמאה מותכת.אופים בחום של 180 מעלות כ-10 דקות או עד הזהבה.טובלים
          בסירופ החם ומצננים.
        instructionEn: >-
          Place the rolls on a baking tray and brush with melted butter. Bake at 180 degrees for about 10 minutes or
          until golden. Dip in the hot syrup and cool.
        timerMinutes: 10
