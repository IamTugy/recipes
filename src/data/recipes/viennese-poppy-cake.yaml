steps:
  - title: ""
    items:
      - instruction: "הבצק: במיקסר מצויד בוו גיטרה מערבלים את החמאה, אבקת הסוכר והוניל."
        instructionEn: "The dough: in a mixer equipped with a guitar hook, mix the butter, powdered sugar and vanilla."
      - instruction: מוסיפים את הביצה ומערבלים לתערובת אחידה.
        instructionEn: Add the egg and mix to a uniform mixture.
      - instruction: מוסיפים את הקמח ומערבלים קלות ליצירת פירורים בצק לחים וגדולים.
        instructionEn: Add the flour and mix lightly to create moist and large dough crumbs.
      - instruction: מחצית מהבצק מעבירים לתוך תבנית אפייה ומהדקים, ואת המחצית הנותרת מותירים כפירורים ומצננים.
        instructionEn: Transfer half of the dough into a baking pan and press, and leave the remaining half as crumbs and cool.
      - instruction: >-
          ההרכבה, האפייה וההגשה: מורחים את מילוי הפרג על גבי בסיס הבצק ומפזרים מעל את פירורי הבצק באופן שווה.מחממים תנור
          לחום של 170 מעלות ואופים את העוגה 35-40 דקות, עד להזהבה.
        instructionEn: >-
          Assembly, baking and serving: spread the poppy filling on top of the dough base and sprinkle the dough crumbs
          evenly over it. Heat the oven to 170 degrees and bake the cake for 35-40 minutes, until golden.
        timerMinutes: 40
      - instruction: מצננים ומאבקים באבקת סוכר.
        instructionEn: Cool and dust with powdered sugar.
