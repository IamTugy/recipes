steps:
  - title: ""
    items:
      - instruction: >-
          מתיכים שוקולדים, חמאה ושמנת לתערובת אחידה. מערבבים עם שאר חומרי המילוי. מצננים למרקם משחתי סמיך ומעבירים לשק
          זילוף.
        instructionEn: >-
          Melt chocolates, butter and cream to a uniform mixture. Mix with the rest of the filling ingredients. Cool to
          a thick paste texture and transfer to a piping bag.
      - instruction: להרכבה ואפייה- מחממים תנור לחום של 170 מעלות.
        instructionEn: For assembly and baking - heat the oven to 170 degrees.
      - instruction: מרדדים את הבצק על משטח מקומח לעלה דק.
        instructionEn: Roll out the dough on a floured surface into a thin sheet.
      - instruction: קורצים עיגולים, מזלפים מהמלוי ומקפלים לצורת אוזן המן.
        instructionEn: Draw circles, sprinkle with the filling and fold into the shape of a manna ear.
      - instruction: מעבירים לתבנית מרופדת בנייר אפייה ואופים כ-15-20 דקות עד להזהבה קלה.
        instructionEn: Transfer to a pan lined with baking paper and bake for about 15-20 minutes until lightly golden.
        timerMinutes: 20
      - instruction: מוציאיםמהתנור, מצננים ומאבקים באבקת סוכר.
        instructionEn: Remove from the oven, cool and dust with powdered sugar.
