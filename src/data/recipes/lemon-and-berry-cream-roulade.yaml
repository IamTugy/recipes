steps:
  - title: ""
    items:
      - instruction: "בצק הרולדה:"
        instructionEn: "Rolled dough:"
      - instruction: >-
          במיקסר מצויד בוו גיטרה שמים את השקדים, אבקת הסוכר, הקמח והביצים ומערבלים לתערובת אחידה, כ-5 דקות. בנפרד,
          מקציפים את החלבונים והסוכר האינברטי למרנג גמיש ומקפלים לתערובת השקדים. משטחים את התערובת על תבנית אפייה מרופדת
          בנייר אפיה משומן בשכבה דקה.
        instructionEn: >-
          In a mixer equipped with a guitar hook, put the almonds, powdered sugar, flour and eggs and mix until a
          uniform mixture, about 5 minutes. Separately, whip the egg whites and invert sugar into a flexible meringue
          and fold into the almond mixture. Spread the mixture on a baking tray lined with greased baking paper in a
          thin layer.
        timerMinutes: 5
      - instruction: אופים 6-7 דקות בחום גבוה של 220 מעלות. מצננים ומאבקים באבקת סוכר, מיישרים שוליים.
        instructionEn: >-
          Bake for 6-7 minutes at a high temperature of 220 degrees. Cool and dust with powdered sugar, straighten
          edges.
        timerMinutes: 7
      - instruction: "מצננים.הקרם:"
        instructionEn: "Cool. The cream:"
      - instruction: >-
          מרתיחים את הפירות. בנפרד טורפים את החלמונים, הסוכר והקורנפלור. יוצקים ממיצי הפירות הרותחים אל תערובת החלמונים
          בהדרגה. מחזירים את התערובת לסיר ומביאים לרתיחה תוך כדי טריפה נמרצת. מסירים מהאש ומוסיפים את החמאה כולה בעוד
          הקרם חם.
        instructionEn: >-
          Boil the fruits. Beat the egg yolks, sugar and cornflour separately. Pour the boiling fruit juices into the
          yolk mixture gradually. Return the mixture to the pot and bring to a boil while whisking vigorously. Remove
          from the heat and add all the butter while the cream is hot.
      - instruction: מעבירים לצינון במיקסר מצויד בוו גיטרה ומצננים לטמפרטורת גוף. מקפלים פנימה את השמנת המתוקה.
        instructionEn: Transfer to cool in a mixer fitted with a guitar hook and cool to body temperature. Fold in the sweet cream.
      - instruction: "מצננים 4 שעות.ההרכבה וההגשה:"
        instructionEn: "Refrigerate for 4 hours. Assembly and serving:"
        timerMinutes: 240
      - instruction: מורחים את הקרם הצונן על בצק הרולדה בשכבה אחידה ומגלגלים לרולדה.
        instructionEn: Spread the cooled cream on the roulade dough in an even layer and roll into a roulade.
      - instruction: מצננים בקירור שעתיים.מעבירים את יתרת הקרם לשק זילוף ומזלפים מעל הרולדה.
        instructionEn: >-
          Cool in the refrigerator for two hours. Transfer the rest of the cream to a piping bag and sprinkle over the
          roulade.
      - instruction: מאבקים באבקת הסוכר ומקשטים בפירות.
        instructionEn: Dusting with powdered sugar and decorating with fruit.
