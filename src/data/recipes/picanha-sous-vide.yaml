id: picanha-sous-vide
title: Picanha Sous Vide
titleHe: פיקנייה סו-ויד
description: פיקנייה מבושלת סו-ויד עם ציפוי תבלינים עשיר, צרובה על שכבת השומן לקבלת קראסט מושלם
descriptionEn: Sous vide picanha with a rich spice rub, seared fat-side for a perfect crust
image: placeholder
category: dinner
difficulty: medium
source: "https://www.sousvide.co.il/recipes/פיקנייה-סו-ויד/"
prepTime: 10
cookTime: 480
servings: 4
tags:
  - בקר
  - סו-ויד
