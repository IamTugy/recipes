steps:
  - title: ""
    items:
      - instruction: מערבבים את כל התבלינים עם שמן זית ליצירת משחת תיבול. מורחים את המשחה על הפיקנייה מכל הצדדים ומעסים היטב.
        instructionEn: Mix all spices with olive oil to form a spice paste. Rub the paste all over the picanha and massage well.
      - instruction: מכניסים את הפיקנייה לשקית ואקום יחד עם ענפי טימין ואוטמים.
        instructionEn: Place the picanha in a vacuum bag with thyme sprigs and seal.
      - instruction: מבשלים בסו-ויד בטמפרטורה של 58 מעלות למשך 8 שעות.
        instructionEn: Cook sous vide at 58°C for 8 hours.
        timerMinutes: 480
      - instruction: מוציאים מהשקית ומייבשים היטב עם נייר סופג. מסרטים את שכבת השומן בסכין חדה בתבנית משבצות.
        instructionEn: Remove from the bag and pat dry thoroughly with paper towels. Score the fat cap in a crosshatch pattern with a sharp knife.
      - instruction: מחממים מחבת ברזל כבדה על חום גבוה מאוד עד שמעשן. מניחים את הפיקנייה עם צד השומן כלפי מטה וצורבים 3-4 דקות עד לקראסט זהוב ופריך.
        instructionEn: Heat a heavy cast iron pan over very high heat until smoking. Place the picanha fat-side down and sear for 3-4 minutes until a golden, crispy crust forms.
        timerMinutes: 4
      - instruction: מניחים לנוח 5 דקות, ואז פורסים נגד כיוון הסיבים. מגישים מיד.
        instructionEn: Rest for 5 minutes, then slice against the grain. Serve immediately.
tips:
  - אם לא מגישים מיד, מעבירים לאמבטיית קרח אחרי הסו-ויד לצינון מהיר ושומרים במקרר עד 3 ימים. לפני ההגשה מחממים בסו-ויד ב-54 מעלות ל-30 דקות וצורבים.
tipsEn:
  - If not serving immediately, transfer to an ice bath after sous vide and refrigerate up to 3 days. Before serving, reheat in sous vide at 54°C for 30 minutes then sear.
