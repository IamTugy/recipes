steps:
  - items:
      - instruction: מחממים תנור ל-160°. משמנים ומקמחים תבנית 20×20 ס"מ.
        instructionEn: Preheat oven to 160°C. Grease and flour a 20×20 cm tin.
      - instruction: שלב 1 - מערבבים מהר שוקולד לבן, גבינה ווניל. מניחים בצד.
        instructionEn: Step 1 - Quickly mix white chocolate, cheese and vanilla. Set aside.
      - instruction: שלב 2 - מניחים את כל חומרי השלב 2 במעבד מזון וטורפים היטב.
        instructionEn: Step 2 - Place all Step 2 ingredients in a food processor and whisk well.
      - instruction: שלב 3 - מנפים את היבשים ומוסיפים לתערובת, מערבלים עד איחוד בלבד. לא מעבדים יתר.
        instructionEn: Step 3 - Sift the dry ingredients into the wet mixture and fold until just combined. Do not overmix.
      - instruction: מוסיפים 80 גרם מהבלילה לקערת הגבינה ומערבבים היטב.
        instructionEn: Add 80g of the batter to the cheese bowl and mix well.
      - instruction: יוצקים את בלילת העוגה לתבנית. מניחים עליה כפות מתערובת הגבינה ומשיישים בסכין.
        instructionEn: Pour the cake batter into the tin. Dollop the cheese mixture on top and swirl with a knife.
        tip: לשישייה יפה - פשוט גררו את הסכין בתנועות S על פני הבלילה.
        tipEn: For a beautiful swirl, drag the knife in S-shaped strokes across the surface.
      - instruction: אופים 45-60 דקות עד שקיסם יוצא עם מעט פירורים לחים.
        instructionEn: Bake 45-60 minutes until a skewer comes out with just a few moist crumbs.
        timerMinutes: 55
