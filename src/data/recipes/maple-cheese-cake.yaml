image: https://assets.tugy.dev/maple-cheese-cake.jpg
description: עוגה רכה ולחה עם שישיית גבינה-שוקולד לבן על בלילת מייפל עשירה - מראה מרשים, טעם מנצח.
descriptionEn: >-
  A moist, soft cake with a white-chocolate cheese swirl on a rich maple batter - stunning presentation, unbeatable
  flavor.
prepTime: 20
cookTime: 55
servings: 12
difficulty: medium
featured: true
