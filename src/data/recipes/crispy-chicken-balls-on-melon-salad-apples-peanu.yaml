steps:
  - title: ""
    items:
      - instruction: לכדורי העוף- מכניסים את כל המרכיבים, למעט העוף ופירורי הלחם, למעבד מזון וטוחנים למחית אחידה.
        instructionEn: >-
          For the chicken balls - put all the ingredients, except the chicken and the breadcrumbs, into a food processor
          and grind to a uniform puree.
      - instruction: מעבירים לקערה, מוסיפים את העוף ופירורי הלחם, מערבבים היטב ומשהים ל1/2 שעה.
        instructionEn: Transfer to a bowl, add the chicken and bread crumbs, mix well and leave for 1/2 hour.
        timerMinutes: 30
      - instruction: אם התערובת רכה מידי לאחר המנוחה ניתן להוסיף עוד מעט פירורי לחם.
        instructionEn: If the mixture is too soft after resting, you can add a little more breadcrumbs.
      - instruction: יוצרים מהתערובת כדורי במשקל 25 גרם.
        instructionEn: Form the mixture into balls weighing 25 grams.
      - instruction: מצננים.
        instructionEn: cooling
      - instruction: להגשה-  מחממים שמן לטיגון עמוק, מצפים את כדורי העוף בתערובת הזרעים ומטגנים להזהבה כ-2 דקות.
        instructionEn: >-
          To serve - heat oil for deep frying, coat the chicken balls with the seed mixture and fry until golden for
          about 2 minutes.
        timerMinutes: 2
      - instruction: מעבירים לנייר סופג.
        instructionEn: Transfer to absorbent paper.
      - instruction: מערבבים את החומרי הסלט עם הרוטב, עורמים על צלחת, מניחים מעל את כדורי העוף ומגישים מיד.
        instructionEn: >-
          Mix the salad ingredients with the dressing, pile on a plate, place the chicken balls on top and serve
          immediately.
