steps:
  - title: ""
    items:
      - instruction: לבצק הקיש- מניחים את החומרים היבשים, חמאה וטימין במעבד מזון וטוחנים לתערובת פירורית.
        instructionEn: >-
          For the quiche dough - place the dry ingredients, butter and thyme in a food processor and grind to a crumbly
          mixture.
      - instruction: מוסיפים את הביצה והחלמון ומעבדים בפולסים קצרים עד קבלת תערובת פירורית לחה.
        instructionEn: Add the egg and yolk and process in short pulses until you get a moist crumbly mixture.
      - instruction: אוספים, עוטפים ומניחים בקירור של שעה.
        instructionEn: Collect, wrap and refrigerate for an hour.
      - instruction: מרדדים את הבצק לעלה בעובי 2 מ"מ.
        instructionEn: Roll out the dough into a sheet with a thickness of 2 mm.
      - instruction: מרפדים את תבנית הקיש.
        instructionEn: Line the quiche mold.
      - instruction: מניחים יריעה של ניילון נצמד או נייר אפייה, מניחים מעל משקולת (קטניות למשל) ואופים בחום של 160 מעלות 20 דקות.
        instructionEn: >-
          Place a sheet of cling film or baking paper, place a weight on top (legumes for example) and bake at 160
          degrees for 20 minutes.
      - instruction: מסירים את המשקולת ואופים עוד 8 דקות.
        instructionEn: Remove the dumbbell and bake for another 8 minutes.
      - instruction: מצננים.למילוי- מאדים את הבצל בחמאה, מוסיפים את הפטריות הקצוצות ומאדים.
        instructionEn: Cool. For the filling - steam the onion in butter, add the chopped mushrooms and steam.
      - instruction: מוסיפים יים ועגבניות מובשות ומרתיחים 5 דקות.
        instructionEn: Add tomatoes and dried tomatoes and boil for 5 minutes.
      - instruction: מתבלים ומצננים מעט.
        instructionEn: Season and cool slightly.
      - instruction: >-
          מפזרים על קלתית הבצק ומפזרים מעל מוצרלה.מערבבים את חומרי הרויאל, יוצקים על הפטריות שבתוך קלתית הקיש ואופים
          כ-30 דקות, עד הזהבה.
        instructionEn: >-
          Sprinkle over the dough crust and sprinkle over mozzarella. Mix the royal ingredients, pour over the mushrooms
          inside the quiche crust and bake for about 30 minutes, until golden.
      - instruction: מניחים לעמוד 15 דק' לאחר האפייה, פורסים ונהנים לצד סלט עלים ירוקים רענן.
        instructionEn: Allow to stand for 15 minutes after baking, slice and enjoy alongside a fresh green salad.
