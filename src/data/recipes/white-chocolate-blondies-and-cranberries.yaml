steps:
  - title: ""
    items:
      - instruction: >-
          מחממים תנור ל-160 מעלות, משמנים ומקמחים תבנית אפיה. מעל באן מארי ממיסים שוקולד וחמאה. בנפרד, מקציפים ביצים
          שלמות, משחת וניל, מלח וסוכר לקציפה אוורירית. מנמיכים את מהירות ההקצפה ומוסיפים את תערובת השוקולד הלבן המומס.
        instructionEn: >-
          Heat an oven to 160 degrees, grease and flour a baking pan. Melt chocolate and butter over a bain marie.
          Separately, beat whole eggs, vanilla paste, salt and sugar until fluffy. Lower the whipping speed and add the
          melted white chocolate mixture.
      - instruction: >-
          מוסיפים את הגבינה הלבנה ומערבבים היטב. מוסיפים אגוזים, חמוציות וקמח ומערבבים רק עד שאחיד. יוצקים את הבלילה
          לתוך התבנית ואופים במשך 30-35 דקות עד להתייצבות. לאחר קירור מוחלט חותכים לקוביות. שומרים את הבלונדיס בכלי אטום
          במקרר.
        instructionEn: >-
          Add the white cheese and mix well. Add nuts, cranberries and flour and mix just until uniform. Pour the batter
          into the pan and bake for 30-35 minutes until set. After complete cooling, cut into cubes. Keep the blondies
          in an airtight container in the refrigerator.
