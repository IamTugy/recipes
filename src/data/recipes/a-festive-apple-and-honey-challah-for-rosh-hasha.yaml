steps:
  - title: ""
    items:
      - instruction: "הבצק: מכניסים לקערת המיקסר את כל המרכיבים היבשים ומתחילים ללוש במהירות איטית תוך הוספת הנוזלים והשמן."
        instructionEn: >-
          The dough: put all the dry ingredients in the mixer bowl and start kneading at a slow speed while adding the
          liquids and oil.
      - instruction: לשים 10 דקות.
        instructionEn: put 10 minutes.
        timerMinutes: 10
      - instruction: >-
          מעבירים לקערה ומתפיחים להכפלת נפח.המילוי: מערבבים את כל החומרים לתערובת אחידה.הכנת העיטור: מניחים את חומרי
          הסירופ בסיר ומרתיחים.
        instructionEn: >-
          Transfer to a bowl and let it rise until it doubles in volume. The filling: mix all the ingredients into a
          uniform mixture. Preparation of the decoration: place the syrup ingredients in a pot and boil.
      - instruction: מכניסים פנימה את פרוסות התפוחים ומרתיחים שוב.
        instructionEn: Put in the apple slices and boil again.
      - instruction: מכבים את האש ומניחים להצטנן כשעתיים.
        instructionEn: Turn off the heat and leave to cool for about two hours.
      - instruction: "מסננים ושומרים את הסירופ.הרכבת החלה: לאחר תפיחת הבצק מחלקים אותו לשלושה חלקים שווים ויוצרים כדור מכל אחד מהם."
        instructionEn: >-
          Filter and save the syrup. The assembly begins: after the dough has risen, divide it into three equal parts
          and form a ball from each of them.
      - instruction: >-
          עוטפים אותם ומניחים בצד ל-15 דקות. מרדדים כל כדור בצק לעלה מלבני. מניחים לאורך המלבן 1/3 מהמילוי ומגלגלים
          לנקניק, גלגול הדוק וצפוף. לאחר מילוי כל חלקי הבצק, קולעים את הנקניקים לצמה.
        instructionEn: >-
          Wrap them and set aside for 15 minutes. Roll each ball of dough into a rectangular sheet. Place 1/3 of the
          filling along the rectangle and roll into a sausage, a tight and dense roll. After filling all the parts of
          the dough, braid the sausages.
        timerMinutes: 15
      - instruction: >-
          מניחים על הצמה, בצורה אקראית, את פרוסות התפוחים המסוכרות (שומרים את הסירופ לזיגוג). מניחים את החלה על מגש
          מרופד בנייר אפייה, כאשר היא מכוסה באופן רופף עם ניילון נצמד, להתפחה כמעט כפולה. מברישים את החלה בביצה טרופה.
          אופים בחום של 180 מעלות כ-35 דקות.
        instructionEn: >-
          Place the candied apple slices randomly on the braid (save the syrup for the glaze). Place the challah on a
          tray lined with baking paper, when it is loosely covered with plastic wrap, to rise almost double. Brush the
          challah with a beaten egg. Bake at 180 degrees for about 35 minutes.
        timerMinutes: 35
