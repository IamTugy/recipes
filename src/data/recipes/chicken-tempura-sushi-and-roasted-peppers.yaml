steps:
  - title: ""
    items:
      - instruction: "מכינים את האורז (לא כמו שמכינים אורז לסושי): שמים אורז ו-½1 כוסות מים בסיר."
        instructionEn: "Prepare the rice (not like you prepare rice for sushi): put rice and ½ cup of water in a pot."
      - instruction: מוסיפים תבלינים ומביאים לרתיחה.
        instructionEn: Add spices and bring to a boil.
      - instruction: מנמיכים את הלהבה ומבשלים מכוסה 25 דקות בדיוק.
        instructionEn: Lower the flame and cook covered for exactly 25 minutes.
        timerMinutes: 25
      - instruction: "מצננים היטב.מכינים את העוף: חוצים את חזה העוף לרוחב, כדי ליצור 2 משטחים דקים, וחותכים לרצועות בעובי 2 ס\"מ."
        instructionEn: >-
          Cool well. Prepare the chicken: cut the chicken breast across, to create 2 thin surfaces, and cut into strips
          2 cm thick.
      - instruction: >-
          מתבלים בפלפל ומלח.מכינים את הרולים: מניחים מחצלת לגלגול סושי על משטח עבודה ועליה דף אצת נורי, כשצידו המבריק
          כלפי מעלה.
        instructionEn: >-
          Season with pepper and salt. Prepare the rolls: place a mat for rolling sushi on a work surface and place a
          sheet of nori seaweed on it, with the shiny side up.
      - instruction: טובלים ידיים במים ומשטחים שכבת אורז בעובי 1/2 ס"מ.
        instructionEn: Dip your hands in water and spread a layer of rice 1/2 cm thick.
      - instruction: מניחים רצועת עוף לרוחב העלה על האורז, לידה רצועת פלפל קלוי ועל הכל פס משחת ווסאבי.
        instructionEn: >-
          Place a strip of chicken across the leaf on the rice, next to it a strip of roasted pepper and all over a
          strip of wasabi paste.
      - instruction: מגלגלים לגלילה הדוקה מאוד.
        instructionEn: Roll into a very tight roll.
      - instruction: >-
          מכינים כך את כל הרולים.מכינים את הרוטב: מערבבים את כל החומרים ושומרים בקירור.מצפים, מטגנים ומגישים: מחממים שמן
          לטיגון עמוק, טורפים ביצים ומתבלים במלח ופלפל.
        instructionEn: >-
          Prepare all the rolls in this way. Prepare the sauce: mix all the ingredients and keep refrigerated. Cover,
          fry and serve: heat oil for deep frying, beat eggs and season with salt and pepper.
      - instruction: >-
          בכלי נפרד מערבבים פירורי לחם עם עשבי תיבול יבשים.טובלים את הרולים בביצה טרופה, מצפים בפירורי לחם ומטגנים בשמן
          החם כ-3 דקות להזהבה עמוקה.
        instructionEn: >-
          In a separate vessel, mix breadcrumbs with dry herbs. Dip the rolls in beaten egg, coat with breadcrumbs and
          fry in the hot oil for about 3 minutes until deep golden.
        timerMinutes: 3
      - instruction: מעבירים לנייר סופג.פורסים את הרולים למנות ומגישים לצד הרוטב.
        instructionEn: Transfer to absorbent paper. Slice the rolls into portions and serve alongside the sauce.
