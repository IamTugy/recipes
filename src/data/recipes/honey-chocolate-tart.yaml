steps:
  - title: ""
    items:
      - instruction: >-
          אופן ההכנת הבצק:במעבד מזון טוחנים חומרים יבשים ואבקת שקדים. מוסיפים חמאה ומעבדים לתערובת פירורית, מוסיפים ביצה
          ומעבדים עד לקבלת בצק פירורי לח. מהדקים, עוטפים בניילון נצמד ומצננים במקרר במשך חצי שעה לפחות. מחממים תנור לחום
          של 160 מעלות.
        instructionEn: >-
          How to prepare the dough: grind dry ingredients and almond powder in a food processor. Add butter and process
          to a crumbly mixture, add an egg and process until a moist crumbly dough is obtained. Tighten, wrap in cling
          film and chill in the fridge for at least half an hour. Heat the oven to 160 degrees.
      - instruction: >-
          מרדדים את הבצק על משטח מקומח ומרפדים 12 תבנית טארט אישיות בקוטר 12 ס"מ. מניחים משקולת ומכניסים למקרר לחצי שעה
          נוספת. אופים אפייה עיוורת 15 דקות, מסירים משקולת
        instructionEn: >-
          Roll out the dough on a floured surface and line 12 individual tart pans with a diameter of 12 cm. Place a
          weight and place in the refrigerator for another half hour. Bake blind baking for 15 minutes, remove the
          weight
        timerMinutes: 15
      - instruction: ואופים עוד 8 דקות להזהבה מלאה.
        instructionEn: and bake for another 8 minutes until fully golden.
        timerMinutes: 8
      - instruction: >-
          הכנת הטופי:מניחים את כל החומרים בסיר, מביאים לרתיחה טובה ומסירים מהאש.מצננים מעל ויוצקים שכבה אחידה על כל אחת
          מהקלתיות.מחזירים לתנור לאפייה קצרה של 8 דקות.מצננים היטב.
        instructionEn: >-
          To make the toffee: place all the ingredients in a pot, bring to a good boil and remove from the heat. Cool on
          top and pour an even layer on each of the cakes. Return to the oven for a short baking of 8 minutes. Cool
          well.
        timerMinutes: 8
      - instruction: >-
          הכנת הגנאש:מתיכים שוקולדים מעל באן מארי. בנפרד מרתיחים שמנת, מלח ודבש. מחברים את שתי התערובות בשלבים ומוסיפים
          גם את השמן וטוחנים היטב בעזרת בלנדר מוט. יוצקים מהתערובת על שכבת הטופי שבתבנית ומעבירים לייצב בקירור. מניחים
          מעל את דיסקיות השוקולד.
        instructionEn: >-
          Preparation of the ganache: melt chocolates over a bain marie. Separately boil cream, salt and honey. Combine
          the two mixtures in stages and also add the oil and grind well with a stick blender. Pour the mixture on the
          toffee layer in the mold and transfer to stabilize in the refrigerator. Place the chocolate discs on top.
