steps:
  - title: ""
    items:
      - instruction: >-
          לבצק: מניחים את כל החומרים למעט הביצה במעבד מזון ומעבדים לקבלת פירורים דקים.מוסיפים ביצה ומעבדים לקבלת פירורי
          בצק לחים.מחלקים את הבצק לשני חלקים: 1/3+2/3.
        instructionEn: >-
          For the dough: Place all the ingredients except the egg in a food processor and process to obtain fine crumbs.
          Add an egg and process to obtain moist dough crumbs. Divide the dough into two parts: 1/3+2/3.
      - instruction: >-
          עוטפים כל אחד מהם ומניחים בקירור לשעה. מחממים תנור לחום של 180 מעלות. מרדדים את 2/3 הבצק לעלה שיכסה את בסיס
          התבנית ומניחים אותו בתוכה. מחוררים את הבצק ואופים אותו 17 דקות, עד הזהבה. מוציאים ומורידים את חום התנור ל-150
          מעלות.
        instructionEn: >-
          Wrap each of them and refrigerate for an hour. Heat an oven to 180 degrees. Roll out 2/3 of the dough into a
          leaf that will cover the base of the mold and place it inside. Pierce the dough and bake it for 17 minutes,
          until golden. Take out and lower the oven heat to 150 degrees.
        timerMinutes: 17
      - instruction: >-
          למילוי: בקערה רחבה מערבבים סוכר וביצים לתערובת אחידה. מוסיפים את שאר החומרים ומערבבים לתערובת אחידה. יוצקים אל
          תבנית האפייה, על הבצק האפוי, ומגררים/מפוררים את 1/3 הבצק הנותר מעל, לכיסוי מלא. מחזירים את העוגה לאפייה של 30
          דקות או התייצבות. מצננים.
        instructionEn: >-
          For the filling: in a wide bowl, mix sugar and eggs to a uniform mixture. Add the rest of the ingredients and
          mix to a uniform mixture. Pour into the baking pan, on the baked dough, and grate/crumble the remaining 1/3 of
          the dough on top, to cover completely. Return the cake to bake for 30 minutes or to set. cooling
        timerMinutes: 30
