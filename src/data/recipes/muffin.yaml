steps:
  - title: ""
    items:
      - instruction: >-
          מחממים מראש תנור לחום בינוני, 180 מעלות. מערבבים בקערה גדולה את כל החומרים היבשים: קמח,אבקת אפיה סודה ומלח.
          בקערה נפרדת טורפים את הביצים והסוכרים, מוסיפים את החלב, החמאה ומשחת הוניל. יוצרים גומה במרכז החומרים היבשים,
          ומוסיפים את החומרים הרטובים.
        instructionEn: >-
          Preheat the oven to medium heat, 180 degrees. Mix all the dry ingredients in a large bowl: flour, baking
          powder, soda and salt. In a separate bowl, beat the eggs and sugars, add the milk, butter and vanilla paste.
          Make a well in the center of the dry ingredients, and add the wet ingredients.
      - instruction: >-
          מערבבים רק עד אשר התערובת אחידה.מוסיפים את השוקולד צ'יפס והאגוזים בתנועת קיפול פנימה.מחלקים את התערובת לתבניות
          השקעים.אופים 15-20 דקות או עד שקיסם הננעץ באמצע המאפינס יוצא עם מעט פירורים לחים עליו.
        instructionEn: >-
          Mix just until the mixture is uniform. Add the chocolate chips and nuts in a folding motion. Divide the
          mixture into the socket molds. Bake for 15-20 minutes or until a toothpick inserted in the middle of the
          muffins comes out with a few moist crumbs on it.
