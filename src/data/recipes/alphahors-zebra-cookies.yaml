id: alphahors-zebra-cookies
title: Alphahors Zebra cookies
titleHe: עוגיות אלפחורס זברה
description: עוגיות אלפחורס זברה
descriptionEn: Alphahors Zebra cookies
image: https://assets.tugy.dev/alphahors-zebra-cookies.jpg
category: dessert
difficulty: easy
prepTime: 15
cookTime: 10
servings: 20
tags:
  - קינוח
