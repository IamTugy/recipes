      - amount: 75
        unit: g
        name: קמח
        nameEn: flour
      - amount: 2
        unit: g
        name: אבקת סודה לשתייה
        nameEn: Baking soda powder
      - amount: 4
        unit: g
        name: אבקת אפייה
        nameEn: baking powder
      - amount: 100
        unit: g
        name: חמאה רכה
        nameEn: Soft butter
      - amount: 80
        unit: g
        name: אבקת סוכר
        nameEn: icing sugar
      - amount: 1
        unit: tsp
        name: משחת וניל
        nameEn: Vanilla paste
      - amount: 40
        unit: g
        name: שמנת מתוקה
        nameEn: sweet cream
      - amount: 3
        unit: ""
        name: חלמונים
        nameEn: egg yolks
      - amount: 20
        unit: g
        name: קקאו כהה
        nameEn: dark cocoa
  - group: למילוי ולציפוי
    items:
      - amount: 200
