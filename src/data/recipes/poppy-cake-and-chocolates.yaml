steps:
  - title: ""
    items:
      - instruction: >-
          מחממים תנור ל - 160 מעלות.במיקסר מצויד בוו גיטרה, מקציפים את החמאה, השמן, הסוכר, קליפת ההדרים ותמצית הוניל
          לתערובת חלקה.
        instructionEn: >-
          Heat the oven to 160 degrees. In a mixer fitted with a guitar hook, beat the butter, oil, sugar, citrus peel
          and vanilla extract until smooth.
      - instruction: >-
          מוסיפים את הביצים בהדרגה ומקציפים עוד 3 דקות. טוחנים את השוקולדים והקמח במעבד מזון לתערובת אבקתית גסה. מקפלים
          באופן ידני את החומרים היבשים, לסירוגין עם הרוויון והתפוחים.
        instructionEn: >-
          Add the eggs gradually and beat for another 3 minutes. Grind the chocolates and flour in a food processor to a
          coarse powdery mixture. Manually fold in the dry ingredients, alternating with the filling and the apples.
      - instruction: >-
          מעבירים לתבנית משומנת ומקומחת ואופים כ- 40-45 דקות עד להזהבה, או עד ששיפוד עץ שנועצים בעוגה יוצא עם מעט
          פירורים לחים. משחררים מהתבנית ומעבירים לצינון מלא מעל רשת. להכנת הציפוי, מחממים את השמנת והנפאז' עד לסף רתיחה
          והמסה מלאה של הנפאז'.
        instructionEn: >-
          Transfer to a greased and floured pan and bake for about 40-45 minutes until golden, or until a wooden skewer
          inserted into the cake comes out with a few moist crumbs. Release from the mold and transfer to cool
          completely on a wire rack. To prepare the coating, heat the cream and the nafage until it boils and the nafage
          is completely dissolved.
      - instruction: >-
          יוצקים אל השוקולד, מכסים את הקערה וממתינים דקה.בוחשים בעזרת מטרפה לתערובת חלקה ואחידה.משתמשים מיד או מצננים
          בכלי אטום עד שבוע בקירור ועד חודשיים בהקפאה.
        instructionEn: >-
          Pour into the chocolate, cover the bowl and wait a minute. Stir with a whisk until a smooth and uniform
          mixture. Use immediately or cool in an airtight container for up to a week in the refrigerator and up to two
          months in the freezer.
      - instruction: לפני כל שימוש יש לחמם בעדינות מעל באן מארי.
        instructionEn: Before each use, gently heat over a bain marie.
