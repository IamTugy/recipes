steps:
  - title: ""
    items:
      - instruction: מחממים תנור ל-160 מעלות.
        instructionEn: Heat the oven to 160 degrees.
      - instruction: משמנים ומקמחים את תבנית האפייה.במיקסר מצויד בוו גיטרה מקציפים חמאה, וניל וסוכר.
        instructionEn: Grease and flour the baking pan. In a mixer fitted with a guitar hook, beat butter, vanilla and sugar.
      - instruction: >-
          מוסיפים את הביצים בהדרגה. בקערה נפרדת, מנפים קמח עם אבקת אפיה וסודה לשתייה. מנמיכים את מהירות המיקסר ומוסיפים
          לסירוגין ובהדרגה את תערובת הקמח ואתהשמנת החמוצה. יוצקים מחצית מהתערובת לתבנית. מערבבים בקערית את חומרי המילוי
          ומפזרים על התערובת שבתבנית.
        instructionEn: >-
          Add the eggs gradually. In a separate bowl, sift flour with baking powder and baking soda. Reduce the speed of
          the mixer and alternately and gradually add the flour mixture and the sour cream. Pour half of the mixture
          into the mold. Mix the filling ingredients in a bowl and sprinkle over the mixture in the mold.
      - instruction: מוסיפים את שאר התערובת ומחליקים. אופים 40 דקות או עד שקיסם שננעץ בעוגה יוצא עם פירורים לחים.
        instructionEn: >-
          Add the rest of the mixture and smooth. Bake for 40 minutes or until a toothpick inserted into the cake comes
          out with moist crumbs.
        timerMinutes: 40
