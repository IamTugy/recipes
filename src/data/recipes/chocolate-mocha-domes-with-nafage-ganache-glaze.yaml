steps:
  - title: ""
    items:
      - instruction: מכינים את גנאש הנפאז'מחממים שמנת מתוקה, מלח ונפאז’ בסיר עד לסף רתיחה והמסה מלאה של הנפאז’.
        instructionEn: >-
          Prepare the nafage ganache by heating sweet cream, salt and nafage in a pot until it reaches boiling point and
          the nafage is completely dissolved.
      - instruction: מערבבים היטב.
        instructionEn: mix well.
      - instruction: יוצקים את התערובת החמה על השוקולד, ממתינים דקה ומערבבים בעזרת מטרפה ידנית או בלנדר מוט לתערובת חלקה ואחידה.
        instructionEn: >-
          Pour the hot mixture over the chocolate, wait a minute and mix with a hand whisk or stick blender for a smooth
          and uniform mixture.
      - instruction: מפרישים מהתערובת 120 גרם לטובת הכנת העוגות.
        instructionEn: Set aside 120 grams of the mixture to make the cakes.
      - instruction: משתמשים מייד או מצננים ושומרים בכלי אטום בקירור עד שבוע או עד חודשיים בהקפאה.
        instructionEn: >-
          Use immediately or cool and store in an airtight container in the refrigerator for up to a week or up to two
          months in the freezer.
      - instruction: לפני כל שימוש מחממים בעדינות מעל בן מארי.
        instructionEn: Before each use, gently heat over a bain-marie.
      - instruction: מכינים את העוגותמחממים תנור ל-170 מעלות ומשמנים תבניות שקעים מסיליקון בחמאה רכה.
        instructionEn: Prepare the cakes, heat the oven to 170 degrees and grease silicon socket molds with soft butter.
      - instruction: מנפים את כל החומרים היבשים לקערה.
        instructionEn: Sift all the dry ingredients into a bowl.
      - instruction: מקציפים חמאה וסוכר בקערת מיקסר עם וו גיטרה כ-3 דקות לתערובת חלקה ואווירירית.
        instructionEn: Beat butter and sugar in a mixer bowl with a guitar hook for about 3 minutes to a smooth and airy mixture.
        timerMinutes: 3
      - instruction: מוסיפים ביצים בהדרגה ותוך כדי הקצפה.
        instructionEn: Add eggs gradually while whisking.
      - instruction: מנמיכים את מהירות המיקסר ומוסיפים שמנת חמוצה ושמנת מתוקה לסירוגין עם תערובת הקמח.
        instructionEn: Lower the speed of the mixer and add sour cream and sweet cream alternately with the flour mixture.
      - instruction: מערבלים רק עד לקבלת תערובת אחידה.
        instructionEn: Mix only until a uniform mixture is obtained.
      - instruction: מחלקים את תערובת העוגה לשניים.
        instructionEn: Divide the cake mixture in half.
      - instruction: מוסיפים לחלק אחד 120 גרם גנאש-נפאז’, מערבבים ומעבירים לשקית זילוף.
        instructionEn: Add 120 grams of ganache-nafage to one portion, mix and transfer to a piping bag.
      - instruction: מעבירים את החלק ללא הגנאש לשקית זילוף נפרדת.
        instructionEn: Transfer the part without the ganache to a separate piping bag.
      - instruction: מזלפים לכל שקע מחצית מהתערובת החומה ומחצית מהתערובת הלבנה עד 3/4 גובה השקעים בלבד, כי העוגה תופחת במהלך האפייה
        instructionEn: >-
          Pour half of the brown mixture and half of the white mixture into each socket up to 3/4 of the height of the
          sockets only, because the cake will shrink during baking
      - instruction: אופים כ-25-20 דקות עד שקיסם הננעץ במרכז העוגה יוצא עם פירורים לחים.
        instructionEn: Bake for about 20-25 minutes until a toothpick inserted in the center of the cake comes out with moist crumbs.
        timerMinutes: 20
      - instruction: מצננים.
        instructionEn: cooling
      - instruction: מצפיםמעמידים רשת על תבנית גדולה.
        instructionEn: Cover and place a grid on a large tray.
      - instruction: מחלצים את העוגות מהתבנית ומניחים אותן על הרשת כך שהכיפות כלפי מעלה
        instructionEn: Take the cakes out of the pan and place them on the grid with the domes facing up
      - instruction: >-
          מחממים מעט את הגנאש-נפאז’ ויוצקים על העוגות עד שהן מצופות בצורה אחידה (את הגנאש שנזל מהרשת אפשר לשמור בקופסה
          במקרר או במקפיא לשימוש עתידי).
        instructionEn: >-
          Heat the ganache-nafage a little and pour it over the cakes until they are evenly coated (the ganache that
          drips from the mesh can be kept in a box in the refrigerator or freezer for future use).
      - instruction: שומרים את העוגות מכוסות בטמפ’ החדר עד יומיים או במקרר עד 4 ימים.
        instructionEn: Keep the cakes covered at room temperature for up to two days or in the refrigerator for up to 4 days.
      - instruction: לפני ההגשה מביאים לטמפ’ החדר.
        instructionEn: Bring to room temperature before serving.
