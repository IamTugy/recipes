steps:
  - title: ""
    items:
      - instruction: >-
          לפרוסות התפוחים- פורסים את התפוחים לפרוסות רוחב דקיקות (לא מקלפים או מגלענים את התפוחים), ניתן להיעזר גם
          במנדולינה.
        instructionEn: >-
          For the apple slices - slice the apples into thin widthwise slices (do not peel or core the apples), you can
          also use a mandoline.
      - instruction: מבשלים את הסוכר והמים לסירופ, מניחים את פרוסות התפוחים בסיר הסירופ, מביאים לרתיחה ומכבים את הלהבה.
        instructionEn: >-
          Boil the sugar and water into syrup, place the apple slices in the syrup pot, bring to a boil and turn off the
          flame.
      - instruction: >-
          מניחים לצינון בסירופ.מרפדים את התבנית בנייר אפייה ומסדרים מעל את פרוסות התפוחים בצורה חופפת.לעוגה- במיקסר
          מצויד בבלון הקצפה מקציפים את הסוכרים, הביצים והזסט כ-10 דקות, לקבלת תערובת תפוחה מאוד.
        instructionEn: >-
          Leave to cool in the syrup. Line the pan with baking paper and arrange the apple slices on top in an
          overlapping manner. For the cake - in a mixer fitted with the whisk balloon, beat the sugars, eggs and zest
          for about 10 minutes, to obtain a very puffy mixture.
        timerMinutes: 10
      - instruction: מזרזפים את השמן בזרם דק.
        instructionEn: Pour the oil in a thin stream.
      - instruction: >-
          מערבבים בעדינות את התפוחים המגוררים, מנפים את החומרים היבשים ומערבלים בעדינות פנימה. מעבירים אל התבנית ואופים
          בחום של 160 מעלות כ-45 דקות. מצננים ומשחררים את העוגה. ניתן להברישה בנפאז׳ חם ולעטרה בקוקוס ואבקת זהב.
        instructionEn: >-
          Gently mix the grated apples, sift the dry ingredients and gently mix in. Transfer to the pan and bake at 160
          degrees for about 45 minutes. Cool and release the cake. Can be brushed with hot nefage and crowned with
          coconut and gold powder.
        timerMinutes: 45
