steps:
  - title: ""
    items:
      - instruction: מייבשים את כבדי העוף על נייר סופג.
        instructionEn: Dry the chicken livers on absorbent paper.
      - instruction: מחממים סיר עם מים לסף רתיחה.
        instructionEn: Heat a pot of water to boiling point.
      - instruction: מוסיפים את הכבדים ומבשלים על סף רתיחה כ-3-5 דקות (לדרגת מידיום).
        instructionEn: Add the livers and cook on the verge of boiling for about 3-5 minutes (to medium level).
        timerMinutes: 5
      - instruction: מעבירים מיד לקערה עם מי קרח.
        instructionEn: Immediately transfer to a bowl of ice water.
      - instruction: מייבשים.
        instructionEn: drying
      - instruction: מחממים את שומן האווז והקוקוס במחבת רחב ומטגנים את הבצלים והשום להזהבה עמוקה.
        instructionEn: Heat the goose fat and coconut in a wide pan and fry the onions and garlic until deep golden.
      - instruction: מתבלים במלח, פלפל שחור וסוכר.
        instructionEn: Season with salt, black pepper and sugar.
      - instruction: מוסיפים יין ומצמצמים היטב.
        instructionEn: Add wine and reduce well.
      - instruction: מעבירים את הכבדים והבצל לבלנדר וטוחנים את התערובת למחית חלקה מאוד.
        instructionEn: Transfer the livers and onions to a blender and grind the mixture into a very smooth puree.
      - instruction: מוסיפים את הג'לטין.
        instructionEn: Add the gelatin.
      - instruction: אם יש צורך, מסננים דרך מסננת רשת.
        instructionEn: If necessary, strain through a mesh strainer.
      - instruction: >-
          מעבירים את הטרין למיכל איחסון, לכוסות אישיות או תבנית אינגליש קייק מרופדת בניילון, עוטפים בניילון נצמד ומצננים
          ל-5 שעות לפחות, רצוי למשך לילה.
        instructionEn: >-
          Transfer the terrine to a storage container, individual glasses or an English cake pan lined with plastic
          wrap, wrap in cling film and refrigerate for at least 5 hours, preferably overnight.
        timerMinutes: 300
      - instruction: מגישים פרוסה מהטרין (במידה ונעשה בתבנית) או מעבירים אותו לשק זילוף ומזלפים על צנים או טוסט.
        instructionEn: >-
          Serve a slice of the terrine (if made in a pan) or transfer it to a sprinkling bag and sprinkle it on toast or
          toast.
      - instruction: מגישים לצד המרמלדה.
        instructionEn: Serve alongside the marmalade.
      - instruction: למרמלדה- מכניסים את כל המרכיבים, למעט הקורנפלור לסיר, מרתיחים ומבשלים 30 דקות.
        instructionEn: For the marmalade - put all the ingredients, except the cornflour, in a pot, boil and cook for 30 minutes.
        timerMinutes: 30
      - instruction: מוסיפים את הקורנפלור המדולל ומביאים לרתיחה טובה.
        instructionEn: Add the diluted cornflour and bring to a good boil.
      - instruction: מצננים.
        instructionEn: cooling
