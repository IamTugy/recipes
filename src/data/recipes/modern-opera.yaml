steps:
  - title: ""
    items:
      - instruction: ביסקוויט לוז-קפה טוחנים את כל החומרים במעבד מזון .
        instructionEn: Hazelnut-coffee biscuit Grind all the ingredients in a food processor.
      - instruction: משטחים על משטח סיליקון משומן, עם שוליים ואופים בחום של 150 מעלות כ-15 דקות.
        instructionEn: Spread on a greased silicone surface, with edges and bake at 150 degrees for about 15 minutes.
        timerMinutes: 15
      - instruction: לגוון בהיר.
        instructionEn: to a light shade.
      - instruction: קראמבלמאחדים את כל החומרים לתערובת פירורית ואופים בחום של 155 מעלות לכ-8 דקות.
        instructionEn: Crumble Combine all the ingredients into a crumbly mixture and bake at 155 degrees for about 8 minutes.
        timerMinutes: 8
      - instruction: מצננים טוחנים ומסננים דרך נפה עבה.
        instructionEn: Cool, grind and filter through a thick sieve.
      - instruction: פריך קריספי משוחזר שוקולד מתיכים את השוקולד.
        instructionEn: Crispy crispy reconstituted chocolate melts the chocolate.
      - instruction: מוסיפים את פירורי הקראמבל והמלח, מערבבים ומורחים על הביסקוויט החם.
        instructionEn: Add the crumble crumbs and salt, mix and spread on the hot biscuit.
      - instruction: אופים בחום 155 מעלות 8 דקות.
        instructionEn: Bake at 155 degrees for 8 minutes.
        timerMinutes: 8
      - instruction: מקפיאים.
        instructionEn: Freezers.
      - instruction: גנאשמחממים שמנת מתוקה ויוצקים מעל השוקולד.
        instructionEn: Ganesh, heat sweet cream and pour over the chocolate.
      - instruction: טוחנים לגנאש אמולסיבי.
        instructionEn: Grind into emulsifying ganache.
      - instruction: יוצקים על הבסיס.
        instructionEn: Pour on the base.
      - instruction: מקפיאים.
        instructionEn: Freezers.
      - instruction: קרם קפהמכינים קרם אנגלייז ישיר עם החליטה והחלמונים.
        instructionEn: Creme de coffee Prepare a direct crème anglaise with the brew and the egg yolks.
      - instruction: יוצקים על השוקולד והג'לטין.
        instructionEn: Pour over the chocolate and gelatin.
      - instruction: טוחנים ומצננים ל-30 מעלות, מקפלים קצפת ויוצקים מעל שכבת הגנאש.
        instructionEn: Grind and cool to 30 degrees, fold in whipped cream and pour over the ganache layer.
      - instruction: מקפיאים.
        instructionEn: Freezers.
      - instruction: הרכבהמזגגים את העוגה, ממתינים מספר דקות לייצוב וחותכים למנות.
        instructionEn: Assembly Glaze the cake, wait a few minutes for stabilization and cut into portions.
      - instruction: מקשטים בזהב.
        instructionEn: Decorate with gold.
