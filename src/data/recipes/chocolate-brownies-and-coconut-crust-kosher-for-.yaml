steps:
  - title: ""
    items:
      - instruction: משמנים את תבנית האפייה בחמאה ומקמחים.
        instructionEn: Grease the baking pan with butter and flour.
      - instruction: מחממים תנור ל-170 מעלות.לבראוניז- מערבבים קמח ומלח.
        instructionEn: Heat oven to 170 degrees. For brownies - mix flour and salt.
      - instruction: >-
          מתיכים את השוקולד והחמאה על סיר כפול מעל אדים.מערבבים את הביצים, הווניל, הסוכר והקפה.מערבבים את השוקולד המומס
          והביצים ומקפלים פנימה את הקמח והקפה, עד לקבלת עיסה חלקה.
        instructionEn: >-
          Melt the chocolate and butter in a double boiler over steam. Mix the eggs, vanilla, sugar and coffee. Mix the
          melted chocolate and eggs and fold in the flour and coffee, until you get a smooth paste.
      - instruction: יוצקים את העיסה לתבנית ואופים 12 דקות.
        instructionEn: Pour the dough into the mold and bake for 12 minutes.
        timerMinutes: 12
      - instruction: לשכבת הקוקוס- מערבבים את כל החומרים.מוציאים את התבנית מהתנור ובזריזות יוצקים מעליה את שכבת הקוקוס.
        instructionEn: >-
          For the coconut layer - mix all the ingredients. Remove the pan from the oven and quickly pour the coconut
          layer over it.
      - instruction: מחזירים לתנור לאפיה של עוד כ-20 דקות או עד הזהבה.
        instructionEn: Return to the oven to bake for another 20 minutes or until golden.
        timerMinutes: 20
      - instruction: מצננים היטב וחותכים למנות.
        instructionEn: Cool well and cut into portions.
