steps:
  - title: ""
    items:
      - instruction: מחממים במחבת שטוח ורחב את שמן הזית, מטגנים את הפרגיות להזהבה, מוציאים ושומרים בצד.
        instructionEn: Heat the olive oil in a wide, flat pan, fry the chicks until golden, remove and keep aside.
      - instruction: >-
          לאותה מחבת מוסיפים שמן זית ומוסיפים את הירקות (ללא העגבניות, הקישוא והשעועית) מטגנים להזהבה ומוסיפים תבלינים.
          מחממים את בציר והזעפרן. מוסיפים את האורז, העגבניות, הקישוא והשעועית, מערבבים היטב, מניחים מעל את הפרגיות
          הצלויות ומנמיכים את האש.
        instructionEn: >-
          Add olive oil to the same pan and add the vegetables (without the tomatoes, zucchini and beans), fry until
          golden and add spices. Heat the stock and saffron. Add the rice, tomatoes, zucchini and beans, mix well, place
          the roasted chicks on top and lower the heat.
      - instruction: מוסיפים את ציר העוף והזעפרן ומבשלים מכוסה כ- 20 דקות.לפני ההגשה מקשטים בלימון ובסלט המיקרו.
        instructionEn: >-
          Add the chicken stock and saffron and cook covered for about 20 minutes. Before serving, garnish with lemon
          and the micro salad.
