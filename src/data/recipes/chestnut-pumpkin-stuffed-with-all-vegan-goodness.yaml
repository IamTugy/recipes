steps:
  - title: ""
    items:
      - instruction: >-
          מחממים את התנור לחום בינוני, 180 מעלות.לדלעות- מסירים את כיפת הדלעות (שומרים בצד) ומרוקנים בעדינות את
          הגרעינים.
        instructionEn: >-
          Heat the oven to medium heat, 180 degrees. For the pumpkins - remove the dome of the pumpkins (keep aside) and
          gently empty the seeds.
      - instruction: מעסים את הפנים והחוץ בשמן זית ומתבלים.
        instructionEn: Massage the inside and outside with olive oil and season.
      - instruction: מניחים על מגש אפיה עמוק כשהחתך פונה מטה, יוצקים את הרוטב והתיבול וצולים ללא כיסוי כשעה לריכוך.
        instructionEn: >-
          Place on a deep baking tray with the cut facing down, pour the sauce and seasoning and roast uncovered for
          about an hour to soften.
      - instruction: >-
          מצננים.מכינים את המילוי- בסיר גדול מחממים שמן זית ומטגנים את הבצל הקצוץ והשום, מוסיפים פטריות, מתבלים ומטגנים
          קלות.
        instructionEn: >-
          Cool. Prepare the filling - heat olive oil in a large pot and fry the chopped onion and garlic, add mushrooms,
          season and fry lightly.
      - instruction: מוסיפים את שאר המרכיבים ומתבלים.ממלאים את הדלעות בתערובת כך שהיא תבלוט מעט מעל שפתם.
        instructionEn: >-
          Add the rest of the ingredients and season. Fill the pumpkins with the mixture so that it protrudes slightly
          above their rim.
      - instruction: מכסים במכסים.מניחים את הדלעות בתבנית עם הרוטב.
        instructionEn: Cover with lids. Place the pumpkins in the pan with the sauce.
      - instruction: מכסים ואופים 1/2 שעה.
        instructionEn: Cover and bake for 1/2 hour.
        timerMinutes: 120
      - instruction: מסירים את הכיסוי ואופים עוד 15 דקות, להזהבה.
        instructionEn: Remove the cover and bake for another 15 minutes, until golden.
        timerMinutes: 15
