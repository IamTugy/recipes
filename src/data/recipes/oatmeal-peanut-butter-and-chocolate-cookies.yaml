steps:
  - title: ""
    items:
      - instruction: מחממים תנור לחום של 180 מעלות.במיקסר מצויד בוו גיטרה מקציפים חמאה, חמאת בוטנים, סוכרים, מלח, קינמון ווניל.
        instructionEn: >-
          Heat an oven to 180 degrees. In a mixer fitted with a guitar hook, beat butter, peanut butter, sugars, salt,
          cinnamon and vanilla.
      - instruction: >-
          מקפידים לקלף את דפנות הקערה מידי פעם. מוסיפים את הביצים אחת אחת, תוך הקפדה על ניקוי דפנות הקערה. מערבבים את
          הקמח עם אבקות ההתפחה ומוסיפים אל הקערה לערבוב קצר. מוסיפים את שיבולת השועל והשוקולדים ומערבלים לאיחוד, מקפידים
          לא לערבב יותר מידי.
        instructionEn: >-
          Make sure to peel the sides of the bowl from time to time. Add the eggs one by one, making sure to clean the
          sides of the bowl. Mix the flour with the baking powder and add to the bowl for a short mixing. Add the oats
          and chocolates and mix to combine, being careful not to mix too much.
      - instruction: יוצרים כדורים במשקל 40 גרם, או בעזרת כף גלידה קפיצית ומניחים על מגש אפייה מרופד בנייר.
        instructionEn: Form balls weighing 40 grams, or with a springy ice cream scoop and place on a baking tray lined with paper.
      - instruction: אופים כ-15-17 דקות להזהבה ונזהרים מאפיית יתר.מצננים היטב ושומרים בכלי אטום.
        instructionEn: >-
          Bake for about 15-17 minutes until golden and be careful not to overbake. Cool well and keep in an airtight
          container.
        timerMinutes: 17
