steps:
  - title: ""
    items:
      - instruction: למאפינס- מחממים תנור לחום של 165 מעלות.
        instructionEn: For muffins - heat the oven to 165 degrees.
      - instruction: במיקסר מצויד בבלון הקצפה מקציפים 5 דקות ביצים, סוכר ווניל.
        instructionEn: In a mixer fitted with a whisk, beat eggs, sugar and vanilla for 5 minutes.
        timerMinutes: 5
      - instruction: מוסיפים בזרם דק את השמן.
        instructionEn: Add the oil in a thin stream.
      - instruction: מנפים את החומרים היבשים ומוסיפים אל התערובת לסירוגין עם הנוזלים.
        instructionEn: Sieve the dry ingredients and add to the mixture alternately with the liquids.
      - instruction: מעבירים לתבניות מאפינס משומניות ואופים 20 דקות, עד אשר קיסם הננעץ בעוגה יוצא עם פירורים לחים.
        instructionEn: >-
          Transfer to greased muffin tins and bake for 20 minutes, until a toothpick inserted into the cake comes out
          with moist crumbs.
        timerMinutes: 20
      - instruction: מצננים.לקרמו- מרתיחים שמנת מתוקה ומחית פרי.
        instructionEn: Cool. For cream - boil sweet cream and fruit puree.
      - instruction: בנפרד טורפים חלמונים וסוכר.
        instructionEn: Beat egg yolks and sugar separately.
      - instruction: משווים טמפרטורות ומחזירים לסיר נקי להמשך בישול עדין עד לטמפרטורה של 82 מעלות.
        instructionEn: Compare temperatures and return to a clean pot to continue gentle cooking up to a temperature of 82 degrees.
      - instruction: מסננים את התערובת מעל השוקולדים, ממתינים מעט ומערבבים להמסה מלאה.
        instructionEn: Strain the mixture over the chocolates, wait a little and stir until completely melted.
      - instruction: >-
          יוצקים לתבניות שקעים (בצילום השתמשתי בתבניות סיליקון stone בקוטר 4 ס"מ) מקפיאים היטב.לציפוי- ממיסים את כל
          החומרים לתערובת חלקה ואחידה.
        instructionEn: >-
          Pour into socket molds (in the photo I used silicon stone molds with a diameter of 4 cm) freeze well. For the
          coating - melt all the ingredients into a smooth and uniform mixture.
      - instruction: מצננים לחום של 40 מעלות.הרכבה- משחררים את הקרמו מתבניות הסיליקון מניחים על גבי רשת ומזגגים בציפוי השוקולד.
        instructionEn: >-
          Cool to a temperature of 40 degrees. Assembly - release the cremo from the silicone molds, place on a grid and
          glaze with the chocolate coating.
      - instruction: מניחים על גבי המאפינס ונועצים שיפוד עץ דקורטיבי להצמדה של הקרמו למאפה.
        instructionEn: Place on top of the muffins and stick a decorative wooden skewer to attach the cremo to the pastry.
      - instruction: מפשירים בקירור.
        instructionEn: Defrost in the refrigerator.
