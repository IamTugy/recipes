steps:
  - title: ""
    items:
      - instruction: בקערה מעל סיר עם מים רותחים קלות (בן מארי), מתיכים שוקולד, שמנת מתוקה וחמאה.
        instructionEn: In a bowl over a pot with lightly boiling water (Bain Marie), melt chocolate, sweet cream and butter.
      - instruction: >-
          מוסיפים אבקת נוגט. בקערה נפרדת, או במיקסר, מקציפים ביצים וסוכר לתערובת אחידה אך לא תפוחה מידי. בזרם דק,
          למוסיפים את תערובת השוקולד לתערובת הביצים, תוך הקצפה. מנפים חומרים יבשים, ומוסיפים בתנועות קיפול לתערובת.
        instructionEn: >-
          Add nougat powder. In a separate bowl, or in a mixer, beat eggs and sugar to a uniform mixture but not too
          swollen. In a thin stream, add the chocolate mixture to the egg mixture, while whisking. Sieve dry
          ingredients, and add with folding movements to the mixture.
      - instruction: >-
          מוסיפים רום.מעבירים לכלי ההגשה וממלאים ¾ מגובהם.אופים בחום בינוני 170 מעלות כ- 5 דקות, עד אשר הפונדנט מתרומם
          ומתייצב.מאבקים באבקת סוכר.
        instructionEn: >-
          Add rum. Transfer to serving dishes and fill ¾ of their height. Bake at medium heat 170 degrees for about 5
          minutes, until the fondant rises and stabilizes. Dust with powdered sugar.
        timerMinutes: 5
