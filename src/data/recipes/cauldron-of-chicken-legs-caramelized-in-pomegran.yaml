steps:
  - title: ""
    items:
      - instruction: מכינים את הבצלים- מחממים תנור לחום של 220 מעלות.
        instructionEn: Prepare the onions - heat the oven to 220 degrees.
      - instruction: מתבלים את הבצלים ומסדרים על מגש האפייה וצולים 25 דקות להזהבה.
        instructionEn: Season the onions and arrange on the baking tray and roast for 25 minutes until golden.
      - instruction: מצננים מעט.מכינים את התבשיל- מחממים שמן זית בסיר שטוח ורחב, מתבלים את השוקיים ומטגנים להזהבה.
        instructionEn: Cool a little. Prepare the stew - heat olive oil in a flat, wide pot, season the shanks and fry until golden.
      - instruction: מוציאים ובאותו סיר מטגנים קלות את השום ותיבול.
        instructionEn: Take out and in the same pot lightly fry the garlic and seasoning.
      - instruction: >-
          מוסיפים את הרכז התפוחים, והחומץ, טימין ורכז רימונים מביאים לרתיחה.מסדרים את העוף הצורה נאה ושוזרים את הבצלים
          המקורמלים ותפוחי העץ.
        instructionEn: >-
          Add the apple concentrate, and the vinegar, thyme and pomegranate concentrate bring to a boil. Arrange the
          chicken in a nice shape and weave in the caramelized onions and apples.
      - instruction: יוצקים מעל את ציר עוף או מים, מתבלים, מרתיחים ומבשלים על להבה נמוכה כשעה.
        instructionEn: Pour over the chicken stock or water, season, boil and cook on a low flame for about an hour.
      - instruction: מידי פעם מטלטלים את הסיר.
        instructionEn: Occasionally shake the pot.
      - instruction: >-
          לקראת סוף הבישול פותחים את המכסה ומצמצמים את הרוטב קלות.להגשה- מעבירים לכלי הגשה נאה, מפזרים מעל שומשום,
          רימונים ותלתלי בצל ירוק.
        instructionEn: >-
          Towards the end of cooking, open the lid and reduce the sauce slightly. To serve - transfer to a nice serving
          dish, sprinkle sesame seeds, pomegranates and green onion curls on top.
