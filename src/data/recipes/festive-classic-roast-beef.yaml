        nameEn: A bunch of fresh thyme, chopped
      - amount: 0.5
        unit: ""
        name: צרור רוזמרין טרי, קצוץ
        nameEn: A bunch of fresh rosemary, chopped
      - amount: 0.333
        unit: cup
