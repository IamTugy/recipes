        nameEn: Dishes
      - amount: 2
        unit: kg
        name: נתח סינטה או אנטריקוט מיושן
        nameEn: A piece of aged sirloin or entrecote
      - amount: 0
        unit: ""
        name: לתיבול-½ כוס שמן זית
        nameEn: For seasoning - ½ cup olive oil
      - amount: 3
        unit: tbsp
        name: חרדל דיז'ון (רצוי עם גרגרים)
        nameEn: Dijon mustard (preferably with grains)
      - amount: 2
