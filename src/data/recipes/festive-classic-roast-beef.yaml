steps:
  - title: ""
    items:
      - instruction: מערבבים את כל מרכיבי התיבול, מורחים על נתח הבשר ומעסים היטב.קושרים בעזרת חוט שפגאט את הנתח כולו.
        instructionEn: >-
          Mix all the seasoning ingredients, apply to the piece of meat and massage well. Tie the whole piece with a
          string.
      - instruction: משהים במקרר לשעתיים לפחות, רצוי ללילה שלם. כשעתיים לפני הצלייה, מוצאים את הנתח לעמוד בטמפרטורת החדר.
        instructionEn: >-
          Place in the refrigerator for at least two hours, preferably overnight. About two hours before roasting, the
          piece is found to stand at room temperature.
      - instruction: >-
          מחממים תנור לחום מקסימלי, מניחים את נתח הסינטה על רשת וצולים בתנור החם 15 דקות, מנמיכים את החום ל-180 מעלות
          וצולים עוד כ-40 דקות (לדרגת צלייה מידיום). מוציאים מהתנור ומשהים כ- 10 דקות לפני הפריסה. פורסים לפרוסות
          דקיקות.
        instructionEn: >-
          Heat an oven to maximum heat, place the sirloin piece on a grill and roast in the hot oven for 15 minutes,
          lower the heat to 180 degrees and roast for another 40 minutes (for a medium roast). Remove from the oven and
          wait for about 10 minutes before serving. Slice into thin slices.
