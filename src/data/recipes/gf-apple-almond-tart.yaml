steps:
  - title: בצק
    titleEn: Pastry
    items:
      - instruction: >-
          במעבד מזון טוחנים חומרים יבשים עם חמאה קרה לפירורים דקים. מוסיפים וניל וביצה ומעבדים לפירורים לחים. מאחדים
          ומשטחים.
        instructionEn: >-
          In a food processor, pulse dry ingredients with cold butter to fine crumbs. Add vanilla and egg and pulse to
          moist crumbs. Press together and flatten.
      - instruction: מניחים עטוף בקירור לחצי שעה.
        instructionEn: Wrap and refrigerate for 30 minutes.
        timerMinutes: 30
      - instruction: מרדדים לעלה 3 מ"מ ומרפדים תבנית טארט. אופים אפייה עיוורת (עם משקולת) ב-160° עד להזהבה מלאה.
        instructionEn: Roll to 3mm thick and line a tart tin. Blind bake (with weights) at 160°C until fully golden.
        timerMinutes: 20
        tip: בצק ללא גלוטן עדין יותר - הדקו אותו בזהירות לתבנית ואל תמשכו.
        tipEn: Gluten-free pastry is more delicate - press it carefully into the tin without stretching.
  - title: קרם שקדים ורכבה
    titleEn: Almond Cream & Assembly
    items:
      - instruction: טוחנים חומרים יבשים ואבקת שקדים במעבד. מוסיפים חמאה ומאחדים. מוסיפים ביצה ורום לתערובת אחידה.
        instructionEn: >-
          Pulse dry ingredients and almond flour in the processor. Add butter and combine. Add egg and rum and mix until
          smooth.
      - instruction: מורחים קרם שקדים על בסיס הטארט. מסדרים פרוסות תפוח מעל ומפזרים סוכר.
        instructionEn: Spread almond cream over the tart base. Arrange apple slices on top and scatter with sugar.
      - instruction: אופים ב-160° כ-40 דקות עד להזהבה ובעבוע הקרם.
        instructionEn: Bake at 160°C for about 40 minutes until golden and the cream is bubbling.
        timerMinutes: 40
      - instruction: מצננים לחלוטין לפני הגשה - הקרם מתייצב בצינון.
        instructionEn: Cool completely before serving - the cream sets as it cools.
        timerMinutes: 60
tips:
  - ניתן לצפות בג'לה תפוחים לקבלת ברק יפה.
  - הטארט נשמר עד 3 ימים בקירור.
tipsEn:
  - Glaze with apple jelly for a beautiful shine.
  - The tart keeps for up to 3 days refrigerated.
