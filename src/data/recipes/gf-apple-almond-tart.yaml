description: טארט תפוחים עדין עם בצק קורנפלור פריך וקרם שקדים עשיר - ללא גלוטן, מלא טעם.
descriptionEn: A delicate apple tart with a crisp cornstarch pastry and rich almond cream - gluten-free and full of flavor.
prepTime: 35
cookTime: 40
servings: 12
difficulty: medium
source: "Oren Giron"
