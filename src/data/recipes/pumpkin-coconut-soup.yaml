steps:
  - title: מרק
    titleEn: Soup
    items:
      - instruction: מכניסים דלעת, בצלים, שום, ג'ינג'ר ומים לסיר - מביאים לרתיחה. מנמיכים ומבשלים עד שהדלעת רכה.
        instructionEn: >-
          Put squash, onions, garlic, ginger and water in a pot - bring to a boil. Reduce heat and cook until squash is
          tender.
        timerMinutes: 25
      - instruction: מרסקים לחלק. מחזירים לסיר עם חלב קוקוס, מביאים לרתיחה ומתבלים. מבשלים עוד 10 דקות.
        instructionEn: Blend until smooth. Return to pot with coconut milk, bring to a simmer, season and cook 10 more minutes.
        timerMinutes: 10
  - title: פלאפל
    titleEn: Health Falafel
    items:
      - instruction: מסננים קטניות ומרסקים במעבד מזון עם שאר החומרים לעיסה. מאחסנים שעה בקירור.
        instructionEn: >-
          Drain legumes and pulse in a food processor with remaining ingredients to a paste. Rest in the fridge for 1
          hour.
        timerMinutes: 60
      - instruction: מחממים שמן לטיגון. מעצבים כדורים ומטגנים עד הזהבה.
        instructionEn: Heat oil for frying. Shape into balls and fry until golden.
        timerMinutes: 5
        tip: כדורים רטובים שידיים - הפלאפל לא יתפרק.
        tipEn: Wet hands when shaping - the falafel won't fall apart.
      - instruction: מוזגים מרק לצלחות ומניחים כדור פלאפל במרכז.
        instructionEn: Ladle soup into bowls and place a falafel ball in the center.
