steps:
  - title: ""
    items:
      - instruction: קרמו מסקרפונה רובילאנגלייז- מניחים את כל החומרים בסיר ומערבבים על קר.
        instructionEn: Crème mascarpone ruby ​​anglaise - place all the ingredients in a pot and mix while cold.
      - instruction: מבשלים לטמפ׳ של 84 מעלות ויוצקים אל מד ליטר בו מונחים הג׳לטין, השוקולד והמסקרפונה.
        instructionEn: >-
          Cook to a temperature of 84 degrees and pour into a liter measure where the gelatin, chocolate and mascarpone
          are placed.
      - instruction: טוחנים היטב בעזרת מוט בלנדר.
        instructionEn: Grind well with a blender rod.
      - instruction: מעבירים מחצית מהתערובת לקירור ואת היתרה מחלקים בין כוסות ההגשה.
        instructionEn: Transfer half of the mixture to the refrigerator and divide the rest between the serving glasses.
      - instruction: מצננים היטב.
        instructionEn: Cool well.
      - instruction: ג׳לה תותמרתיחים מים וסוכר.
        instructionEn: Boil water and sugar for tomato jelly.
      - instruction: מתיכים את הג׳לטין ומערבבים עם המחית.
        instructionEn: Melt the gelatin and mix with the puree.
      - instruction: מצננים מעט ויוצקים לכוסות מעל הקרמו ומקפיאים.
        instructionEn: Cool slightly and pour into glasses over the crema and freeze.
      - instruction: קציפת פירות יערמקציפים את שני החומרים עד לקבלת קציפה רכה ויציבה.
        instructionEn: Berry whipped cream Beat the two ingredients until you get a soft and stable whipped cream.
      - instruction: מעבירים לשק זילוף וממלאים מעל ג׳לה התות.
        instructionEn: Transfer to a piping bag and fill with strawberry jelly.
      - instruction: מעבירים לקירור.
        instructionEn: Transfer to cooling.
      - instruction: טוויל קרמלמחממים תנור לחום של 160 מעלות.
        instructionEn: Caramel twill Heat the oven to 160 degrees.
      - instruction: בסיר מחממים חמאה, סוכר וגלוקוזה.
        instructionEn: Heat butter, sugar and glucose in a pot.
      - instruction: מוסיפים יבשים לערבוב קל.
        instructionEn: Add dry for easy mixing.
      - instruction: מניחים כמות של כפית מהתערובת בתבנית שקעים מסיליקון ואופים 8-10 דקות.
        instructionEn: Place a teaspoonful of the mixture in a silicone mold and bake for 8-10 minutes.
        timerMinutes: 10
      - instruction: מצננים ומשחררים.
        instructionEn: Cool and release.
      - instruction: מניחים על נייר סופג.
        instructionEn: Place on absorbent paper.
      - instruction: הרכבהמניחים את הטוויל על שפת הכוס ומעטרים בזילוף קרם ותות טרי.
        instructionEn: >-
          Assembly Place the twill on the rim of the glass and garnish with a sprinkling of cream and fresh
          strawberries.
