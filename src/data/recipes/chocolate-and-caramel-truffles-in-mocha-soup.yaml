steps:
  - title: ""
    items:
      - instruction: "גנאש: מכינים קרמל מהסוכר ומהמים."
        instructionEn: "Ganache: make caramel from the sugar and water."
      - instruction: פותחים אותו בעזרת שמנת מתוקה וקרם קוקוס חמים.מוסיפים שוקולד קצוץ וממיסים.
        instructionEn: Open it with sweet cream and warm coconut cream. Add chopped chocolate and melt.
      - instruction: >-
          מוסיפים חמאה ורום ומצננים מעט. יוצקים למסגרת 40X20 ומצננים היטב לייצוב. חותכים לקוביות בגודל 2X2 ס"מ, מצפים
          בקקאו ושומרים בהקפאה. מרק מוקה: בסיר מביאים לסף רתיחה חלב קוקוס, שמנת מתוקה, קפה ווניל. טורפים בנפרד את
          החלמונים עם הסוכר.
        instructionEn: >-
          Add butter and rum and cool slightly. Pour into a 40x20 frame and cool well to stabilize. Cut into 2x2 cm
          cubes, coat in cocoa and keep in the freezer. Mocha soup: In a saucepan, bring coconut milk, sweet cream,
          coffee and vanilla to a boil. Separately beat the egg yolks with the sugar.
      - instruction: >-
          משווים טמפרטורה בין הנוזל לחלמונים, מחזירים את התערובת לסיר וממשיכים לבחוש את התערובת על אש נמוכה עד שהיא
          מסמיכה ומגיעה לטמפרטורה של 86 מעלות. (אסור להרתיח!). מעבירים את התערובת למי קרח וממשיכים לבחוש עד לקירור,
          מעבירים לכלי אטום.
        instructionEn: >-
          Compare the temperature between the liquid and the egg yolks, return the mixture to the pot and continue
          stirring the mixture over low heat until it thickens and reaches a temperature of 86 degrees. (Do not boil!).
          Transfer the mixture to ice water and continue stirring until cooled, transfer to an airtight container.
      - instruction: "ניתן לשמור בקירור מס' ימים.טוויל: בקלחת ממיסים חמאה, מוסיפים סוכר, קפה, גלוקוזה ושקדים גרוסים."
        instructionEn: >-
          Can be kept refrigerated for several days. Twill: melt butter in a cauldron, add sugar, coffee, glucose and
          ground almonds.
      - instruction: >-
          מבשלים עד ל-110 מעלות.משטחים על משטח סיליקון, מניחים מעל עוד יריעת סיליקון ומרדדים לעלה דק מאוד.מסירים את שכבת
          הסיליקון העליונה ואופים בחום של 180 מעלות במשך 8-10 דקות.
        instructionEn: >-
          Cook up to 110 degrees. Spread on a silicone surface, place another sheet of silicone on top and roll into a
          very thin sheet. Remove the top layer of silicone and bake at 180 degrees for 8-10 minutes.
        timerMinutes: 10
      - instruction: "מצננים ושומרים בכלי אטום.להגשה: מוזגים מעט מרק מוקה, מניחים קוביית טראפלס ונועצים טוויל מעל."
        instructionEn: >-
          Cool and store in an airtight container. To serve: pour a little mocha soup, place a cube of truffles and
          stick a twill on top.
