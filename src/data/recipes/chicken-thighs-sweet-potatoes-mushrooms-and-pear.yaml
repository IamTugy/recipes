steps:
  - title: ""
    items:
      - instruction: מחממים שמן בסיר שטוח ורחב, מתבלים את השוקיים ומטגנים להזהבה יחד עם הבצל והשום.
        instructionEn: Heat oil in a flat and wide pot, season the shanks and fry until golden with the onion and garlic.
      - instruction: >-
          מוציאים ושומרים חם.לאותו סיר מוסיפים את הסוכר, יוצרים קרמל ופותחים בעזרת בצלצלי הפנינה ונוזלי הכבישה, מביאים
          לרתיחה.
        instructionEn: >-
          Take out and keep warm. Add the sugar to the same pot, create a caramel and open with the pearl onions and the
          pickling liquid, bring to a boil.
      - instruction: מוסיפים את הסויה ומחזירים את העוף והבצלים.מוסיפים ציר עוף, מתבלים, מרתיחים ומבשלים על להבה נמוכה 15 דקות.
        instructionEn: >-
          Add the soy and return the chicken and onions. Add chicken stock, season, boil and cook on a low flame for 15
          minutes.
      - instruction: מידי פעם מטלטלים את הסיר.מוסיפים את הבטטות והפטריות וממשיכים לבשל עוד 30 דקות.
        instructionEn: Occasionally shake the pot. Add the sweet potatoes and mushrooms and continue cooking for another 30 minutes.
      - instruction: >-
          לקראת סוף הבישול ניתן לפתוח את המכסה לצמצום הרוטב, או להעביר לתנור להשחמה.להגשה- מתקנים תיבול, מפזרים את הבצל
          הקצוץ, מטלטלים מעט ומגישים.
        instructionEn: >-
          Towards the end of cooking, you can open the lid to reduce the sauce, or transfer to the oven to brown. To
          serve - adjust the seasoning, sprinkle the chopped onion, shake a little and serve.
