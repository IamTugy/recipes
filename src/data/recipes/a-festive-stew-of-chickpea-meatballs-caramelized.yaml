steps:
  - title: ""
    items:
      - instruction: "לקציצות: מחממים מחבת רחבה ומטגנים את הבצל והכרישה עד לריכוך ולהזהבה."
        instructionEn: "For the meatballs: heat a wide pan and fry the onion and leek until softened and golden."
      - instruction: מצננים.
        instructionEn: cooling
      - instruction: מניחים בקערה את כל יתר החומרים, לשים ומעבדים היטב את עיסת הקציצות.
        instructionEn: Place all the other ingredients in a bowl, put and process the meatball pulp well.
      - instruction: "משהים במקרר כחצי שעה.לרוטב: מחממים בסיר רחב (רצוי סיר שמתאים גם לאפייה בתנור) את שמן הזית."
        instructionEn: >-
          Put in the refrigerator for about half an hour. For the sauce: heat the olive oil in a wide pot (preferably a
          pot that is also suitable for baking in the oven).
      - instruction: מוסיפים את הבצלים והשום ומטגנים תוך ערבוב עד לקבלת גוון חום זהבהב.
        instructionEn: Add the onions and garlic and fry while stirring until golden brown.
      - instruction: >-
          מוסיפים את שאר החומרים, מערבבים, מכסים וממשיכים לבשל כרבע שעה.מוציאים את העיסה מהמקרר ויוצרים קציצות בקוטר 4־5
          ס"מ.
        instructionEn: >-
          Add the rest of the ingredients, mix, cover and continue to cook for about fifteen minutes. Remove the dough
          from the refrigerator and make meatballs with a diameter of 4-5 cm.
      - instruction: מכניסים את הקציצות בעדינות אל הרוטב.
        instructionEn: Put the meatballs gently into the sauce.
      - instruction: מנענעים קלות את הסיר כך שהרוטב יצפה את הקציצות.
        instructionEn: Shake the pot slightly so that the sauce covers the meatballs.
      - instruction: מכסים את הסיר ומביאים לרתיחה.מעבירים לתנור שחומם מראש לחום בינוני (180 מעלות), וממשיכים לבשל כשעה.
        instructionEn: >-
          Cover the pot and bring to a boil. Transfer to an oven preheated to medium heat (180 degrees), and continue to
          cook for about an hour.
      - instruction: לקראת תום הבישול מסירים את המכסה ומזהיבים את הקציצות קלות.
        instructionEn: Towards the end of cooking, remove the lid and lightly brown the meatballs.
      - instruction: מוציאים ומעטרים בעלי כוסברה טרייה קצוצה גס
        instructionEn: Remove and garnish with coarsely chopped fresh coriander leaves
