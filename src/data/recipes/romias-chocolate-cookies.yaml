steps:
  - title: ""
    items:
      - instruction: >-
          מכינים את הבצק: מקציפים את החמאה הרכה ואבקת הסוכר במיקסר בעל וו גיטרה. מוסיפים את הקקאו, המלח ולבסוף את
          החלבון. מוסיפים את הקמח בבת אחת ומערבלים לאיחוד.
        instructionEn: >-
          Prepare the dough: beat the softened butter and powdered sugar in a mixer with a guitar hook. Add the cocoa,
          salt and finally the protein. Add the flour all at once and mix to combine.
      - instruction: "מכינים את המילוי: מניחים את כל מרכיבי המילוי בקלחת (סיר קטן עם ידית אחת) ומרתיחים עד לטמפרטורה של 118 מעלות."
        instructionEn: >-
          Prepare the filling: place all the filling ingredients in a cauldron (a small pot with one handle) and boil to
          a temperature of 118 degrees.
      - instruction: >-
          מצננים את המילוי.מעבירים את הבצק לשק זילוף בעל צנתר סולטן sultan (צנתר המיועד לזילוף טבעות בצק) ומזלפים על
          תבנית מרופדת בנייר אפיה.
        instructionEn: >-
          Cool the filling. Transfer the dough to a piping bag with a sultan nozzle (a tube designed for piping dough
          rings) and pour onto a baking sheet lined with baking paper.
      - instruction: מקפיאים ל-10 דקות.
        instructionEn: Freeze for 10 minutes.
        timerMinutes: 10
      - instruction: מניחים מעט מתערובת המילוי במרכז כל טבעת בצק.מחממים תנור לחום של 180 מעלות ואופים 12 דקות.
        instructionEn: >-
          Place a little of the filling mixture in the center of each dough ring. Heat the oven to 180 degrees and bake
          for 12 minutes.
        timerMinutes: 12
      - instruction: מצננים היטב על מגש האפייה ומעבירים לכלי אטום.
        instructionEn: Cool well on the baking tray and transfer to an airtight container.
