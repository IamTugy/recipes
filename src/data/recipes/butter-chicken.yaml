cuisine: Indian
image: https://assets.tugy.dev/butter-chicken.jpg
description: עוף עסיסי במרינדת תבלינים ורוטב עגבניות עשיר עם שמנת - קלאסיק הודי שכובש את כולם.
descriptionEn: >-
  Juicy chicken in a spiced marinade, finished in a rich tomato-cream sauce - an iconic Indian classic that wins
  everyone over.
prepTime: 30
cookTime: 60
servings: 6
difficulty: medium
source: "Oren Giron"
featured: true
