steps:
  - title: מרינדה
    titleEn: Marinade
    items:
      - instruction: קולים את גרגרי הכוסברה והכמון ומעבירים עם שאר חומרי המרינדה למעבד מזון - טוחנים היטב.
        instructionEn: Toast the coriander and cumin seeds, then blend with the remaining marinade ingredients until smooth.
      - instruction: מעסים את המרינדה אל קוביות העוף, מכסים ומשהים לפחות 3 שעות (עדיף 12 שעות) בקירור.
        instructionEn: Rub the marinade into the chicken pieces, cover and refrigerate for at least 3 hours (12 hours is ideal).
        timerMinutes: 180
        tip: ככל שהעוף ישהה יותר זמן במרינדה - הטעם עמוק יותר.
        tipEn: The longer the chicken marinates, the deeper the flavor.
  - title: רוטב
    titleEn: Sauce
    items:
      - instruction: מחממים חמאה בסיר רחב ומזהיבים קלות. מטגנים בצל וג'ינג'ר עד ריכוך.
        instructionEn: Melt butter in a wide pot over medium heat. Sauté onion and ginger until soft.
      - instruction: מוסיפים את התבלינים ומטגנים 30 שניות. מוסיפים לימון, פסאטה ושמנת מתוקה.
        instructionEn: Add spices and cook 30 seconds. Add lemon juice, passata and cream.
        timerMinutes: 1
      - instruction: מביאים לרתיחה, מנמיכים ומצמצמים 30 דקות עד שהרוטב סמיך מאוד.
        instructionEn: Bring to a boil, reduce heat and simmer 30 minutes until the sauce is very thick.
        timerMinutes: 30
      - instruction: מסירים עלי דפנה, טוחנים את הרוטב ומסננים לסיר נקי.
        instructionEn: Remove bay leaves, blend the sauce and strain back into the pot.
  - title: סיום
    titleEn: Finish
    items:
      - instruction: מחממים מחבת עם מעט שמן וצורבים את העוף להשחמה משני הצדדים.
        instructionEn: Heat a pan with a little oil and sear the chicken until browned on both sides.
      - instruction: מוסיפים את העוף לרוטב החם, מרתיחים 2-3 דקות ומוסיפים עלי כוסברה קצוצים.
        instructionEn: Add the chicken to the warm sauce, simmer 2-3 minutes and finish with fresh cilantro.
        timerMinutes: 3
      - instruction: מגישים עם אורז לבן מאודה.
        instructionEn: Serve with steamed white rice.
tips:
  - ניתן להכין את הרוטב כמה שעות מראש ולחמם לפני ההגשה.
  - לגרסה כשרה - מחליפים חמאה בשמן קוקוס ושמנת מתוקה בקרם קוקוס.
tipsEn:
  - The sauce can be made hours ahead and reheated before serving.
  - For a dairy-free version, substitute butter with coconut oil and cream with coconut cream.
