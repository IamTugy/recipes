id: basmati-rice-infused-with-earl-gray-and-amaranth
title: Basmati rice infused with Earl Gray and Amaranth with almond nougatine and spicy pistachio
titleHe: אורז בסמטי בחליטת ארל גריי ואמרטו עם נוגטין שקדים ופיסטוק פיקנטי
description: אורז בסמטי בחליטת ארל גריי ואמרטו עם נוגטין שקדים ופיסטוק פיקנטי
descriptionEn: Basmati rice infused with Earl Gray and Amaranth with almond nougatine and spicy pistachio
image: https://assets.tugy.dev/basmati-rice-infused-with-earl-gray-and-amaranth.jpg
category: dinner
difficulty: hard
prepTime: 15
cookTime: 18
servings: 4
tags:
  - ארוחת ערב
ingredients: []
steps:
  - title: ""
    items:
      - instruction: לאורז- מרתיחים את ציר העוף וחליטת האמרטו והארל גריי.
        instructionEn: For the rice - boil the chicken stock and the Amaretto and Earl Gray infusion.
      - instruction: בסיר רחב מחממים שמן ומאדים בצל ושום כתוש עד הזהבה עדינה.
        instructionEn: In a wide pot, heat oil and fry the onion and crushed garlic until lightly golden.
      - instruction: מוסיפים את האורז והתבלינים ומטגנים 3-5 דקות, עד אשר האורז חם למגע.
        instructionEn: Add the rice and spices and fry for 3-5 minutes, until the rice is hot to the touch.
      - instruction: מוסיפים את הציר המתובל והרותח לאורז, מוסיפים גם את האמרטו, מביאים שוב לרתיחה, מתבלים ומכסים.
        instructionEn: >-
          Add the seasoned and boiling stock to the rice, add the amaretto as well, bring to a boil again, season and
          cover.
      - instruction: >-
          מנמיכים את הלהבה ומבשלים 18 דקות על להבה נמוכה מאוד. (יש להקפיד לא לפתוח את הסיר במהלך הבישול) מכבים את הלהבה
          משאירים מכוסה 10 דקות.
        instructionEn: >-
          Lower the flame and cook for 18 minutes on a very low flame. (Make sure not to open the pot during cooking)
          Turn off the flame and leave covered for 10 minutes.
      - instruction: פותחים את המכסה ומפזרים את התפוחים.
        instructionEn: Open the lid and scatter the apples.
      - instruction: מערבבים בעדינות בעזרת מזלג ומגישים עם נוגטין מעל.
        instructionEn: Mix gently with a fork and serve with nougatine on top.
      - instruction: לנוגטין- מערבבים את כל החומרים ומשטחים על מגש אפיה מרופד בנייר אפייה.
        instructionEn: For nougatine - mix all the ingredients and spread on a baking tray lined with baking paper.
      - instruction: אופים כ-15-20 דקות ב-180 מעלות.
        instructionEn: Bake for about 15-20 minutes at 180 degrees.
      - instruction: מצננים ושוברים לפיסות קטנות.
        instructionEn: Cool and break into small pieces.
      - instruction: שומרים בקופסה אטומה.
        instructionEn: Keep in a sealed box.
