description: טירמיסו קלאסי עם ביסקוטי בישקוטי תוצרת בית, זביונה אמיתית וקרם מסקרפונה עדין - מושלם.
descriptionEn: Classic tiramisu with homemade ladyfingers, a real zabaglione and a silky mascarpone cream - perfection.
prepTime: 45
cookTime: 15
servings: 8
difficulty: medium
featured: true
