steps:
  - title: ""
    items:
      - instruction: לבצק- במיקסר מצויד בוו גיטרה מקציפים חלמונים וסוכר לתערובת בהירה.
        instructionEn: For the dough - in a mixer equipped with a guitar hook, beat egg yolks and sugar to a light mixture.
      - instruction: מוסיפים חמאה רכה וממשיכים להקציף 5 דקות.
        instructionEn: Add soft butter and continue whipping for 5 minutes.
      - instruction: מוסיפים את יתרת החומרים היבשים ומאחדים.
        instructionEn: Add the rest of the dry ingredients and combine.
      - instruction: מרדדים בין שני ניירות אפייה לעלה בעובי 8 מ"מ ומקפיאים ל-10 דקות.מחממים תנור לחום של 150 מעלות.
        instructionEn: >-
          Roll out between two pieces of baking paper into an 8 mm thick sheet and freeze for 10 minutes. Heat the oven
          to 150 degrees.
      - instruction: משמנים את תבניות האפייה בחמאה רכה ומפזרים סוכר על דפנותיהם.מוצאים את הבצק מהמקפיא וקורצים אותו בעזרת התבנית.
        instructionEn: >-
          Grease the baking pans with soft butter and sprinkle sugar on their sides. Find the dough from the freezer and
          pinch it with the pan.
      - instruction: משאירים את הבצק בתוך התבנית ומעבירים למגש אפייה.אופים 25 דקות ומיד שולפים את התבנית מתוך הבצק.
        instructionEn: >-
          Leave the dough inside the mold and transfer to a baking tray. Bake for 25 minutes and immediately pull the
          mold out of the dough.
      - instruction: מצננים היטב.לקרם- מניחים במיקסר מצויד בבלון את כל חומרי הקרם ומקציפים לקצפת יציבה.
        instructionEn: >-
          Cool well. For the cream - place all the ingredients for the cream in a mixer equipped with a balloon and whip
          to a firm whipped cream.
      - instruction: מחלקים את הקרם לשניים ומוסיפים למחצית אחת את מחית הפיסטוק.
        instructionEn: Divide the cream in half and add the pistachio puree to one half.
      - instruction: >-
          מעבירים את שני הקרמים לשקיות זילוף מצויידות בצנתר חלק במידה של 8 מ"מ.מזלפים בועות של קרמים לסירוגין על בסיסי
          הברטון, עורכים מעל את התותים בצורה נאה ומזגגים בנפאז'.
        instructionEn: >-
          Transfer the two creams to piping bags equipped with an 8 mm smooth nozzle. Pour bubbles of creams alternately
          on the barton bases, arrange the strawberries on top in a nice way and glaze with Nafage.
