steps:
  - title: ""
    items:
      - instruction: >-
          מחממים תנור ל-160 מעלות ומשמנים תבנית אינגליש באורך 30 או 35 ס"מ במעט חמאה מומסת. מקציפים חמאה ואבקת סוכר
          במיקסר עם וו גיטרה (או בעזרת מקציף חשמלי ידני) במהירות בינונית. מוסיפים את הביצים בהדרגה, אחת אחרי השניה
          ומקציפים עד לקבלת תערובת חלקה.
        instructionEn: >-
          Heat an oven to 160 degrees and grease a 30 or 35 cm long English pan with a little melted butter. Beat butter
          and powdered sugar in a mixer with a guitar hook (or with a manual electric beater) at medium speed. Add the
          eggs gradually, one after the other and beat until a smooth mixture is obtained.
      - instruction: מנפים חומרים יבשים (קמח, אבקת שקדים, קורנפלור, אבקת אפיה) ומוסיפים בהדרגה לקערה (שבה תערובת החמאה).
        instructionEn: >-
          Sift dry ingredients (flour, almond powder, cornflour, baking powder) and gradually add to the bowl (return to
          the butter mixture).
      - instruction: מקציפים עד לקבלת מסה חלקה.
        instructionEn: Beat until smooth.
      - instruction: >-
          מחלקים את התערובת ל-1/3 ול-2/3, בשתי קערות נפרדות.בקערה נוספת (קטנה) מדללים את מחית הפיסטוק עם החלב ומוסיפים
          ל-1/3 מהתערובת.
        instructionEn: >-
          Divide the mixture into 1/3 and 2/3, in two separate bowls. In another (small) bowl, dilute the pistachio
          puree with the milk and add to 1/3 of the mixture.
      - instruction: >-
          מוסיפים אליה את הדובדבנים ומערבבים.מעבירים את שתי התערובות לסירוגין לתבנית ומערבבים קלות בעזרת כף או מזלג,
          ליצירת דוגמת שיש.
        instructionEn: >-
          Add the cherries to it and mix. Transfer the two mixtures alternately to the mold and mix lightly with a spoon
          or fork, to create a marble pattern.
      - instruction: מכניסים לתנור ואופים במשך 45-55 דקות או עד שקיסם הננעץ בעוגה יוצא כשעליו פירורים.
        instructionEn: >-
          Put in the oven and bake for 45-55 minutes or until a toothpick inserted into the cake comes out with crumbs
          on it.
        timerMinutes: 55
      - instruction: מוציאים ומצננים.לציפוי- מתיכים את כל החומרים מעל באן מארי, מצננים לום גוף ומצפים את העוגה.
        instructionEn: >-
          Take out and cool. For the coating - melt all the ingredients over a bain-marie, cool slightly and cover the
          cake.
      - instruction: מקשטים עם פניני קראנצ׳ ופטל מיובש.
        instructionEn: Decorate with crunch pearls and dried raspberries.
