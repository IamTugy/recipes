steps:
  - title: ""
    items:
      - instruction: מחממים תנור ל-170 מעלות.
        instructionEn: Heat the oven to 170 degrees.
      - instruction: ממיסים את השוקולד והחמאה בסיר אדים כפול.
        instructionEn: Melt the chocolate and butter in a double boiler.
      - instruction: מוסיפים פרלינה לוז.
        instructionEn: Add hazelnut praline.
      - instruction: במיקסר מצויד בבלון הקצפה מקציפים את הביצים והסוכר לקצף תפוח ואוורירי, כ-5 דקות.
        instructionEn: >-
          In a mixer equipped with the whisk balloon, beat the eggs and sugar to a fluffy and fluffy foam, about 5
          minutes.
      - instruction: מוסיפים את תערובת השוקולד.
        instructionEn: Add the chocolate mixture.
      - instruction: מוסיפים את הקורנפלור והלוז הטחון, מערבבים לאיחוד.
        instructionEn: Add the cornflour and ground hazelnuts, mix to combine.
      - instruction: מעבירים לתבנית משומנת ומקומחת, ואופים ב- 170 מעלות 45 דקות.
        instructionEn: Transfer to a greased and floured pan, and bake at 170 degrees for 45 minutes.
      - instruction: מצננים.
        instructionEn: cooling
      - instruction: "לזיגוג: ממיסים את כל החומרים ללא השקדים מעל באן מארי."
        instructionEn: "For the glaze: melt all the ingredients without the almonds over a bain-marie."
      - instruction: מצננים לטמפרטורה של 40 מעלות, מוסיפים שקדים ומזגגים את העוגה.
        instructionEn: Cool to a temperature of 40 degrees, add almonds and glaze the cake.
