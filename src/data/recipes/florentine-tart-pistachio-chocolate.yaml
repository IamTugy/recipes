steps:
  - title: ""
    items:
      - instruction: לבצק- מערבלים במעבד מזון את כל החומרים היבשים לקבלת תערובת פירורית.
        instructionEn: For the dough - mix all the dry ingredients in a food processor to get a crumbly mixture.
      - instruction: מוסיפים חלבון ומעבדים עד קבלת פירורי בצק לחים.
        instructionEn: Add protein and process until you get moist dough crumbs.
      - instruction: עוטפים ומצננים לשעה.
        instructionEn: Wrap and chill for an hour.
      - instruction: מרדדים את הבצק לעלה בעובי 3 מ"מ ומרפדים תבנית טארט.
        instructionEn: Roll the dough into a 3 mm thick sheet and line a tart pan.
      - instruction: מניחים מעל משקול ואופים אפייה עיוורת של 15 דקות ב-160 מעלות.
        instructionEn: Place a weight on top and bake blind for 15 minutes at 160 degrees.
      - instruction: מסירים את המשקולת ואופים עוד 15 דקות להזהבה מלאה.
        instructionEn: Remove the weight and bake for another 15 minutes until fully golden.
      - instruction: >-
          מצננים.לתערובת הפלורנטין- שמים בסיר סוכר, חמאה, שמנת, גלוקוזה ודבש, מביאים לרתיחה ומבשלים לטמפרטורה של 118
          מעלות צלסיוס (כדור רך, soft ball).
        instructionEn: >-
          Cool. For the Florentine mixture - put sugar, butter, cream, glucose and honey in a saucepan, bring to a boil
          and cook to a temperature of 118 degrees Celsius (soft ball).
      - instruction: מוסיפים את השקדים, מערבבים היטב ויוצקים אל הטארט.
        instructionEn: Add the almonds, mix well and pour into the tart.
      - instruction: אופים ב-160 מעלות כ-17 דקות.
        instructionEn: Bake at 160 degrees for about 17 minutes.
      - instruction: מצננים.לקרם פיסטוק- מתיכים את השוקולד, השמנת והפיסטוק.
        instructionEn: Cool. For the pistachio cream - melt the chocolate, cream and pistachios.
      - instruction: מצננים ל-6 שעות ומקציפים לקרם חלק ויציב.
        instructionEn: Cool for 6 hours and whip into a smooth and stable cream.
      - instruction: ממלאים את הטארט בשכבה אחידה.לקרם שוקולד חלב-תפוז- מתיכים את השוקולד, שמנת וזסט תפוז.
        instructionEn: >-
          Fill the tart in an even layer. For the milk chocolate-orange cream, melt the chocolate, cream and orange
          zest.
      - instruction: מצננים ל-6 שעות ומקציפים לקרם חלק ויציב.
        instructionEn: Cool for 6 hours and whip into a smooth and stable cream.
      - instruction: מעבירים לשק זילוף מצויד בצנתר חלק מספר 8 מזלפים מעל הטארט.
        instructionEn: Transfer to a piping bag equipped with a part number 8 nozzle and sprinkle over the tart.
      - instruction: מאבקים קלות באבקת קקאו ומצננים ל-5 שעות לפני ההגשה.
        instructionEn: Dust lightly with cocoa powder and chill for 5 hours before serving.
