steps:
  - title: ""
    items:
      - instruction: >-
          מכניסים את הקמח, אבקת האפייה, המלח והחמאה למעבד מזון וטוחנים לפירורים דקים.מוסיפים את שאר חומרי הבצק ומעבדים
          עד קבלת בצק.
        instructionEn: >-
          Put the flour, baking powder, salt and butter in a food processor and grind to fine crumbs. Add the rest of
          the dough ingredients and process until you get a dough.
      - instruction: "עוטפים ומניחים בקירור לשלוש שעות.המילוי:"
        instructionEn: "Wrap and refrigerate for three hours. The filling:"
      - instruction: >-
          מחממים תנור לחום של 170 מעלות. מערבבים את כל החומרים לתערובת אחידה ומניחים בקירור לחצי שעה. מרדדים את הבצק
          לעלה בעובי 2 מ"מ. מניחים את המילוי על גבי הבצק ומגלגלים לרולדה הדוקה.
        instructionEn: >-
          Heat the oven to 170 degrees. Mix all the ingredients to a uniform mixture and refrigerate for half an hour.
          Roll the dough into a sheet with a thickness of 2 mm. Place the filling on top of the dough and roll into a
          tight roll.
      - instruction: >-
          בעזרת סכין משור פורסים את הרולדה ל-16 שושנים ומניחים על תבנית אפיה מרופדת בנייר אפייה. אופים 30 דקות או עד
          הזהבה.
        instructionEn: >-
          Using a serrated knife, slice the roulade into 16 roses and place on a baking sheet lined with baking paper.
          Bake for 30 minutes or until golden.
        timerMinutes: 30
