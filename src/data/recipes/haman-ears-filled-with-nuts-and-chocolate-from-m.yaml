steps:
  - title: ""
    items:
      - instruction: מערבבים את כל חומרי המילוי לתערובת אחידה ומצננים.
        instructionEn: Mix all the filling ingredients into a uniform mixture and cool.
      - instruction: מחממים תנור ל-170 מעלות.
        instructionEn: Heat the oven to 170°C.
      - instruction: מרדדים כל בצק לעלה מלבני ומורחים את המילוי.
        instructionEn: Roll each dough into a rectangular sheet and spread the filling.
      - instruction: אופים 20 דקות עד הזהבה קלה.
        instructionEn: Bake for 20 minutes until lightly golden.
        timerMinutes: 20
      - instruction: מוציאים מהתנור ומאבקים מיד באבקת סוכר. מצננים ומגישים.
        instructionEn: Remove from the oven and immediately dust with powdered sugar. Cool and serve.
