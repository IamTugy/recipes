steps:
  - title: ""
    items:
      - instruction: בקלחת רחבה המונחת מעל להבה בינונית מניחים מים, מלח, סוכר, דבש קמח תפוחי אדמה וקורנפלור.
        instructionEn: In a wide cauldron placed over a medium flame, place water, salt, sugar, honey, potato flour and cornflour.
      - instruction: >-
          בוחשים ללא הרף עד להסמכה מלאה של המרכיבים והיפרדותם מדפנות הקלחת.מעבירים למיקסר מצויד בוו גיטרה ובוחשים לקירור
          לחום גוף.מוסיפים לסירוגין ובהדרגה את המים והשמן.
        instructionEn: >-
          Stir continuously until the ingredients are fully incorporated and separate from the sides of the bowl.
          Transfer to a mixer equipped with a guitar hook and stir to cool to body temperature. Add alternately and
          gradually the water and oil.
      - instruction: >-
          מוסיפים את הביצים, הקמח והשמרים. ממשיכים ללוש כ-3 דקות להיטמעות החומרים ועד קבלת בצק אחיד ומעט דביק. משמנים את
          הבצק ומעבירים לקערה משומנת להתפחה עד הכפלת הנפח. מחלקים את הבצק למנות במשקל 60-80 גרם ומעצבים את צורת
          הלחמניות.
        instructionEn: >-
          Add the eggs, flour and yeast. Continue kneading for about 3 minutes until the ingredients are incorporated
          and until you get a uniform and slightly sticky dough. Oil the dough and transfer to a greased bowl to rise
          until doubled in volume. Divide the dough into portions weighing 60-80 grams and shape the shape of the buns.
      - instruction: מניחים על מגש אפייה, מברישים בביצה טרופה ומפזרים שומשום.
        instructionEn: Place on a baking tray, brush with beaten egg and sprinkle with sesame seeds.
      - instruction: מכסים ומניחים להתפחה של 80% מנפח הבצק המקורי.מחממים תנור לחום של 200 מעלות ואופים 18-20 דקות להזהבה.
        instructionEn: >-
          Cover and let rise to 80% of the original dough volume. Heat the oven to 200 degrees and bake for 18-20
          minutes until golden.
      - instruction: מצננים ואורזים היטב בניילון.
        instructionEn: Cool and wrap well in plastic.
