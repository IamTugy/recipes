steps:
  - title: ""
    items:
      - instruction: לעוגה- במיקסר מצויד בבלון הקצפה מניחים את הסוכר, וניל, שמן, טחינה רסק תפוחים, תחליף חלב,  קפה ומלח.
        instructionEn: >-
          For the cake - in a mixer equipped with a whisk, place the sugar, vanilla, oil, tahini, applesauce, milk
          replacer, coffee and salt.
      - instruction: מקציפים היטב.
        instructionEn: Beat well.
      - instruction: במעבד מזון טוחנים היטב את כל החומרים היבשים ומוסיפים אל קערת החומרים הרטובים.
        instructionEn: In a food processor, grind all the dry ingredients well and add to the bowl of the wet ingredients.
      - instruction: מערבבים לאיחוד יסודי.
        instructionEn: Mix to thoroughly combine.
      - instruction: לשטרויזל-  מניחים את כל החומרים במעבד מזון וטוחנים בפולסים לתערובת פירורית לחה.
        instructionEn: >-
          For the streusel - place all the ingredients in a food processor and grind in pulses to a moist crumbly
          mixture.
      - instruction: שומרים בקירור או הקפאה.
        instructionEn: Keep refrigerated or frozen.
      - instruction: הרכבה- משמנים ומקמחים את התבנית ומעבירים את הבלילה לתוכה.
        instructionEn: Assembly - grease and flour the mold and transfer the batter into it.
      - instruction: ממתינים 15 דקות לספיגה.
        instructionEn: Wait 15 minutes for absorption.
        timerMinutes: 15
      - instruction: >-
          מפזרים מעל את השטרויזל.מחממים תנור לחום של 165 מעלות ואופים כ-40 דקות, עד לנעיצת קיסם היוצא עם מעט פירורים
          לחים.
        instructionEn: >-
          Sprinkle the streusel on top. Heat the oven to 165 degrees and bake for about 40 minutes, until a toothpick
          comes out with a few moist crumbs.
        timerMinutes: 40
