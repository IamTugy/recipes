steps:
  - title: ""
    items:
      - instruction: "אופן הכנת הבצק: מכניסים לקערת המיקסר את כל המרכיבים, למעט החמאה, ולשים 5 דקות."
        instructionEn: >-
          How to make the dough: Put all the ingredients, except the butter, into the mixer bowl and let it sit for 5
          minutes.
        timerMinutes: 5
      - instruction: מוסיפים את החמאה וממשיכים ללוש עוד 3 דקות או עד הטמעות מלאה שלה בבצק.
        instructionEn: Add the butter and continue kneading for another 3 minutes or until it is fully incorporated into the dough.
        timerMinutes: 3
      - instruction: מעבירים לקערה ומתפיחים כשעה. מעבירים להתפחה נוספת בקירור, ל-6 שעות.
        instructionEn: >-
          Transfer to a bowl and leave to rise for about an hour. Transfer to another rise in the refrigerator, for 6
          hours.
        timerMinutes: 360
      - instruction: >-
          למחרת מקפלים את החמאה (200 גרם) לתוך הבצק: מרדדים את הבצק על משטח מקומח לעלה בגודל 50X30 ס"מ. משטחים את החמאה
          בין שתי יריעות ניילון לעלה מלבני בגודל 2/3 ממלבן הבצק.
        instructionEn: >-
          The next day, fold the butter (200 grams) into the dough: roll the dough on a floured surface into a 50x30 cm
          sheet. Spread the butter between two plastic sheets into a rectangular sheet 2/3 the size of the dough
          rectangle.
      - instruction: >-
          מניחים את מלבן החמאה על מלבן הבצק ב-2/3 התחתונים שלו ומקפלים את החלק החשוף של הבצק מעל 1/2 מהחמאה ואת החלק
          התחתון מעל (מתקבל קיפול המדמה ספר). מסובבים את הבצק ב-90 מעלות , מרדדים למלבן וחוזרים שוב על פעולת הקיפול.
          מצננים כשעתיים.
        instructionEn: >-
          Place the rectangle of butter on the rectangle of dough in its lower 2/3 and fold the exposed part of the
          dough over 1/2 of the butter and the bottom part over (a fold simulating a book is obtained). Turn the dough
          90 degrees, roll it into a rectangle and repeat the folding process again. Cool for about two hours.
      - instruction: >-
          מרדדים את הבצק למלבן רחב, מורחים את המלית בשכבה אחידה ומקפלים לחצי, מרדדים קלות וחותכים למלבנים. קורצים בצורת
          פפיון.
        instructionEn: >-
          Roll the dough into a wide rectangle, spread the filling in an even layer and fold in half, roll slightly and
          cut into rectangles. Shape into bow-ties (papillons).
