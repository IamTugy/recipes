steps:
  - title: ""
    items:
      - instruction: >-
          מחממים את התנור לחום של 160 מעלות. מניחים את כל החומרים היבשים- חומרי חלק א׳, במעבד מזון עם להב הפלדה וטוחנים
          לאבקה, כדקה רצופה. מוסיפים את כל החומרים הרטובים, חומרי חלק ב׳, ומפעילים שוב לאיחוד.
        instructionEn: >-
          Heat the oven to 160 degrees. Place all the dry ingredients - ingredients of part A, in a food processor with
          the steel blade and grind to a powder, for about a minute straight. Add all the wet ingredients, ingredients
          of part B, and stir again to combine.
      - instruction: >-
          מעבירים לתבנית משומנת היטב ואופים כ-45 דקות, או עד אשר קיסם הננעץ בעוגה יוצא עם מעט פירורים לחים דבוקים אליו.
          מצננים, הופכים על צלחת הגשה ומאבקים באבקת סוכר.
        instructionEn: >-
          Transfer to a well-greased pan and bake for about 45 minutes, or until a toothpick inserted into the cake
          comes out with a few moist crumbs stuck to it. Cool, turn on a serving plate and dust with powdered sugar.
        timerMinutes: 45
