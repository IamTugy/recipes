steps:
  - title: ""
    items:
      - instruction: >-
          חותכים את המלפפון, הכרוב והמלון לז׳וליין ומניחים בקערה עם יתרת חומרי הסלט.לרוטב- מניחים את כל החומרים בקנקן
          וטוחנים למרקם חלק.
        instructionEn: >-
          Cut the cucumber, cabbage and melon into julienne and place in a bowl with the rest of the salad ingredients.
          For the sauce - place all the ingredients in a jar and grind to a smooth texture.
      - instruction: טועמים ומתקנים תיבול.מערבבים את החומרים עם הרוטב ומגישים מיד.
