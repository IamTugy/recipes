steps:
  - title: ""
    items:
      - instruction: >-
          מאפינס: מחממים תנור ל-190 מעלות.מנפים חומרים יבשים לתוך קערת המיקסר, מוסיפים את החומרים הרטובים, התאנים
          והטימין.
        instructionEn: >-
          Muffins: Heat the oven to 190 degrees. Sieve dry ingredients into the mixer bowl, add the wet ingredients,
          figs and thyme.
      - instruction: מערבבים בעדינות עד לקבלת תערובת אחידה.
        instructionEn: Mix gently until a uniform mixture is obtained.
      - instruction: מעבירים לתבניות מאפינס מסיליקון משומנות, ולאופים עד להזהבה כ-14 דקות.
        instructionEn: Transfer to greased silicone muffin tins, and bake until golden, about 14 minutes.
      - instruction: "מצננים על רשת.המבורגר: מעבדים את כל המרכיבים, מערבבים היטב ומשהים לחצי שעה."
        instructionEn: "Cool on a wire rack. Hamburger: process all the ingredients, mix well and leave for half an hour."
      - instruction: >-
          טועמים ומתקנים תיבול.מחממים מחבת עם מעט שמן לטיגון.יוצרים המבורגרים בקוטר המאפינס ומטגנים קלות עד
          הזהבה.מעבירים לתנור וצולים עוד 5-8 דקות.
        instructionEn: >-
          Taste and adjust the seasoning. Heat a pan with a little oil for frying. Form hamburgers the size of the
          muffins and lightly fry until golden. Transfer to the oven and roast for another 5-8 minutes.
      - instruction: "מעבירים לנייר סופג.עגבניות: צולים את העגבניות בתנור בחום של 220 מעלות במשך 5 דקות."
        instructionEn: "Transfer to absorbent paper. Tomatoes: Roast the tomatoes in the oven at 220 degrees for 5 minutes."
      - instruction: "שומרים בטמפ' החדר.להגשה: חוצים את המאפינס, מורחים מיונז ומניחים מעל את ההמבורגרים."
        instructionEn: "Keep at room temperature. To serve: cut the muffins, spread mayonnaise and place the hamburgers on top."
      - instruction: מכסים בכיפת המאפינס ונועצים קיסם ועגבניית שרי צלויה.
        instructionEn: Cover with the muffin dome and insert a toothpick and a roasted cherry tomato.
      - instruction: מגישים מיד כמתאבן.
        instructionEn: Serve immediately as an appetizer.
      - instruction: בלוג  המדריך המלא להכנת מקארון
        instructionEn: The complete guide blog for making macarons
      - instruction: מקארון היא אולי העוגיה האופנתית ביותר שקיימת נכון לעכשיו.
        instructionEn: A macaron is perhaps the most fashionable cookie that exists right now.
      - instruction: שלה ומגוון הטעמים והצבעים שיש בה- גורמים להרבה מאוד לקוחות להפוך אותה למה שהיא.
        instructionEn: Her and the variety of flavors and colors she has - cause many customers to make her what she is.
      - instruction: לא סתם סדנת המקארון שאנו מעבירים בבית הספר היא אחת מהמבוקשות שיש.
        instructionEn: It is not for nothing that the macaron workshop we conduct at the school is one of the most popular.
      - instruction: היום נלמד להכין את העוגיה שלב אחרי שלב.
        instructionEn: Today we will learn to make the cookie step by step.
      - instruction: ההכנה אינה מאוד מסובכת- אך מצריכה הכנה קפדנית ודיוק.
        instructionEn: The preparation is not very complicated - but requires careful preparation and precision.
      - instruction: >-
          אני אשבור מספר מיתוסים בדרך להכנתו- כמו שלא צריך להשתמש בחלבוני ביצה ישנים  או שלא צריך לייבש את המקארונים
          לפני האפיה.
        instructionEn: >-
          I will break a number of myths on the way to making it - like you don't have to use old egg whites or you
          don't have to dry the macarons before baking.
      - instruction: מרכיבי המקארון הינם חלבוני ביצה, סוכר, אבקת סוכר ואבקת שקדים.
        instructionEn: The macaron ingredients are egg whites, sugar, powdered sugar and almond powder.
      - instruction: על פניו מרנג פשוט.
        instructionEn: On the surface is a simple meringue.
      - instruction: אך לא כך.
        instructionEn: But not so.
      - instruction: את המתכון אנו מחלקים לשני חלקים.
        instructionEn: We divide the recipe into two parts.
      - instruction: החלק הראשון הינו המרנג, אותה קציפת אוויר שתעניק לעוגיה את מרקמה ונפחה.
        instructionEn: The first part is the meringue, that air whipping that will give the cookie its texture and volume.
      - instruction: >-
          את המרנג אנו מכינים בשטית המרנג האיטלקי- בו מבשלים סוכר ומים לסירופ רותח וצמיג מאוד, עד לטמפרטורה של 118 מעלות
          צלסיוס.
        instructionEn: >-
          We prepare the meringue using the Italian meringue method - in which sugar and water are boiled into a boiling
          and very viscous syrup, up to a temperature of 118 degrees Celsius.
      - instruction: בשמה המקצועית נקראת נקודת בישול זו soft ball- כדור רך.
        instructionEn: By its professional name, this cooking point is called a soft ball.
      - instruction: נקודה בה הסוכר נשמר מבריק, סמיך ואלסטי.
        instructionEn: A point where the sugar is kept shiny, thick and elastic.
      - instruction: >-
          מיד כשהסירופ מגיע לנקודה זו (חובה להיעזר במד חום לסוכר), מוזגים אותו, תוך כדי הקצפה מהירה של החלבונים, אל קערת
          המיקסר.
        instructionEn: >-
          As soon as the syrup reaches this point (a sugar thermometer must be used), pour it, while rapidly whipping
          the egg whites, into the mixer bowl.
      - instruction: מקציפים עד שהתערובת מגיעה לטמפרטורת גוף.
        instructionEn: Whisk until the mixture reaches body temperature.
      - instruction: המרנג אמור להתקבל גמיש ורך.
        instructionEn: The meringue should be flexible and soft.
      - instruction: >-
          במקביל, מערבבים היטב את החלק השני- תערובת השקדים ואבקת הסוכר- אותה חובה לנפות דרך נפת רשת על מנת לקבל אבקה
          אחידה והומגנית- עם יתרת החלבון (שאינו מוקצף כלל) למרקם מרציפני דביק.
        instructionEn: >-
          At the same time, mix well the second part - the almond mixture and the sugar powder - which must be sifted
          through a mesh strainer in order to get a uniform and homogeneous powder - with the rest of the protein (which
          is not whipped at all) to a sticky marzipan texture.
      - instruction: לתערובת זו אם רוצים ניתן להוסיף צבעי מאכל או תמציות טעם על מנת לקבל מקארון בצבעים או טעמים.
        instructionEn: >-
          If you want, you can add food coloring or flavor extracts to this mixture in order to get a macaron with
          colors or flavors.
      - instruction: >-
          שלב איחוד התערובת נעשה בשני שלבים: בשלב הראשון לוקחים 1/3  מהמרנג ואותו מוסיפים אל "המרציפן" ומערבבים על מנת
          לרככו.
        instructionEn: >-
          The step of combining the mixture is done in two steps: in the first step, take 1/3 of the meringue and add it
          to the "marzipan" and mix in order to soften it.
      - instruction: את יתרת המרנג מוסיפים עתה בתנועות קלות של קיפול ולחיצה.
        instructionEn: Now add the rest of the meringue with light movements of folding and pressing.
      - instruction: המסה לא אמורה להתקבל אוורירית מאוד.
        instructionEn: The mass should not be very airy.
      - instruction: "היא אמורה להבריק ו\"לזרום\": נסו להרים ממנה כף גדושה ולהטותה מטה."
        instructionEn: "It should shine and \"flow\": try to pick up a full spoonful of it and tilt it down."
      - instruction: התערובת אמורה לזרום בתנועה כבדה שמותירה על יתרת המסה שובל שאינו נעלם מיד.
        instructionEn: >-
          The mixture should flow in a heavy motion that leaves a trail on the rest of the mass that does not disappear
          immediately.
      - instruction: כעת העבירו את התערובת לשק זילוף מצויד בצנתר עגול בקוטר 8-10 מ"מ וזלפו עיגולים מדויקים בקוטר 3-4 ס"מ.
        instructionEn: >-
          Now transfer the mixture to a piping bag equipped with a round tube with a diameter of 8-10 mm and pipe
          precise circles with a diameter of 3-4 cm.
      - instruction: >-
          מומלץ להיעזר במשטח סיליקון עם הטבעה בצורת המקארון או לצייר על נייר אפיה עיגולים אחידים בעזרת פורמה ואז לזלף
          ללא קושי.
        instructionEn: >-
          It is recommended to use a silicone surface with an imprint in the shape of the macaron or to draw uniform
          circles on baking paper with a forma and then sprinkle without difficulty.
      - instruction: חממו את התנור לחום של 140 מעלות ואפו את המקארון 17-20 דקות.
        instructionEn: Heat the oven to 140 degrees and bake the macaron for 17-20 minutes.
      - instruction: הוא יבריק, יתרומם וייצור את ה"חצאית" המוכרת בבסיסו.
        instructionEn: It will shine, rise and form the familiar "skirt" at its base.
      - instruction: כעת תנו לו להצטנן לחלוטין ורק אז שחררו אותו בעדינות והדביקו אותו עם זילוף של קרם גבינה משובח.
        instructionEn: >-
          Now let it cool completely and only then release it gently and stick it with a sprinkling of fine cream
          cheese.
      - instruction: ועכשיו- ס ב ל נ ו ת!!!
        instructionEn: And now - S B L N U T!!!
      - instruction: מקארון יהיה במיטבו 8-12 שעות מרגע הצמדתו עם קרם.
        instructionEn: A macaron will be at its best 8-12 hours from the moment it is attached with cream.
      - instruction: נסו להתאפק ולא לאכול אותו מיד.
        instructionEn: Try to hold back and not eat it right away.
      - instruction: היא יישמר בקירור כשבוע ובמקפיא כחודש.
        instructionEn: It will keep refrigerated for about a week and in the freezer for about a month.
      - instruction: אני מבטיח שלאחר שתצליחו להוציא מקארון חתיך ראשון תחת ידיכם- לא תרפו ותרצו עוד…
        instructionEn: >-
          I promise that after you manage to get the first handsome Makaron under your hands - you will not let go and
          want more...
