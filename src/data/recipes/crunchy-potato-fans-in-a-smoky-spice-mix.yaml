steps:
  - title: ""
    items:
      - instruction: שוטפים היטב את תפוחי האדמה, מנגבים ומייבשים.
        instructionEn: Wash the potatoes well, wipe and dry.
      - instruction: >-
          חוצים את תפוחי האדמה לאורכם וכל חצי חותכים בצפיפות אך לא עד הסוף, כמו מניפה. בקערה מערבבים את התבלינים
          והנוזלים, ויוצקים מעט מהתערובת מעל תפוחי האדמה. מרפדים תבנית תנור עמוקה בנייר אפייה ומסדרים בה את מניפות תפוחי
          האדמה המתובלות על צדן השטוח.
        instructionEn: >-
          Cut the potatoes lengthwise and cut each half thickly but not all the way, like a fan. In a bowl, mix the
          spices and liquids, and pour a little of the mixture over the potatoes. Line a deep oven tray with baking
          paper and arrange the seasoned potato fans on the flat side.
      - instruction: >-
          יוצקים על תפוחי האדמה את יתרת הרוטב, מכסים בנייר אפייה ומעליו מניחים רדיד אלומיניום.בתנור שחומם מראש לחום
          בינוני (180 מעלות) אופים במשך שעה.
        instructionEn: >-
          Pour the rest of the sauce over the potatoes, cover with baking paper and place aluminum foil on top. Bake for
          an hour in an oven preheated to medium heat (180 degrees).
      - instruction: מסירים את הכיסוי וצולים עוד מספר דקות, עד הזהבה.
        instructionEn: Remove the cover and roast for a few more minutes, until golden.
      - instruction: מעטרים ומגישים חם.
        instructionEn: Garnish and serve hot.
