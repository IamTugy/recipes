steps:
  - title: ""
    items:
      - instruction: >-
          במיקסר מצויד בוו גיטרה מקציפים חמאה, טחינה, סוכר וגבינה עד לקבלת תערובת גרגרית, מוסיפים קמח ולשים עד קבלת בצק
          אחיד.
        instructionEn: >-
          In a mixer equipped with a guitar hook, beat butter, tahini, sugar and cheese until a granular mixture is
          obtained, add flour and knead until a uniform dough is obtained.
      - instruction: >-
          מחלקים לשלושה חלקים, עוטפים בניילון ומקררים לשעתיים.למילוי- מכניסים את כל המרכיבים, למעט פירורי לביסקוויטים,
          לתוך סיר, מביאים לרתיחה ומערבבים עד לקבלת תערובת אחידה.
        instructionEn: >-
          Divide into three parts, wrap in plastic and refrigerate for two hours. For the filling - put all the
          ingredients, except for the biscuit crumbs, into a pot, bring to a boil and mix until a uniform mixture is
          obtained.
      - instruction: מסירים מן האש ומוסיפים פירורים.
        instructionEn: Remove from heat and add crumbs.
      - instruction: >-
          מצננים.מרדדים כל חלק בצק על משטח מקומח לעלה דק, מניחים 1/3 מהתערובת לאורך קצה מלבן הבצק ומגלגלים לגלילה
          מהודקת.
        instructionEn: >-
          Cool. Roll out each piece of dough on a floured surface into a thin sheet, place 1/3 of the mixture along the
          edge of the dough rectangle and roll into a tight roll.
      - instruction: >-
          חוזרים על פעולה זו עם יתרת הבצק והמילוי. מעבירים לתבנית מרופדת בנייר אפייה ומסמנים חתכים על גבי הרולדה, שתקל
          על פריסתה לאחר האפייה. אופים בחום של 160 מעלות כ-30 דקות, עד הזהבה, מוציאים מהתנור ופורסים לפרוסות.
        instructionEn: >-
          Repeat this operation with the remaining dough and filling. Transfer to a pan lined with baking paper and mark
          cuts on top of the roulade, which will make it easier to spread after baking. Bake at 160 degrees for about 30
          minutes, until golden, remove from the oven and cut into slices.
      - instruction: מצננים ומגישים.
        instructionEn: Cool and serve.
