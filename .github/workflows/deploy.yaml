name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch: {}

env:
  DOCKERHUB_USER: tugy

jobs:
  build:
    # Cluster nodes are arm64-only, so amd64 images were never deployed -
    # only ever built to satisfy the matrix. Building natively on an arm64
    # runner instead of amd64+QEMU emulation removes the emulation tax
    # entirely (QEMU-emulated `npm ci`/`vite build` was the slow part,
    # already known to hang on recipes-mcp's small image).
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - app: recipes
            dockerfile: Dockerfile
            platforms: linux/arm64
            runs-on: ubuntu-24.04-arm
          - app: recipes-api
            dockerfile: api/Dockerfile
            platforms: linux/arm64
            runs-on: ubuntu-24.04-arm
          - app: recipes-mcp
            dockerfile: mcp/Dockerfile
            platforms: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Gate the API image on its test suite. A failure here fails the job,
      # which blocks both the image push and the downstream deploy.
      - name: Set up Node
        if: matrix.app == 'recipes-api'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Run API tests
        if: matrix.app == 'recipes-api'
        working-directory: api
        run: |
          npm ci
          npm test
          npm run test:e2e

      # Gate the frontend image on the react-hooks lint rules specifically
      # (not the full lint suite, which has a large backlog of pre-existing
      # issues unrelated to correctness) - this class of bug throws at
      # runtime in production but tsc alone doesn't catch it.
      - name: Set up Node
        if: matrix.app == 'recipes'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check for React Hooks rule violations
        if: matrix.app == 'recipes'
        run: |
          npm ci
          npx eslint 'src/**/*.{ts,tsx}' --format json > eslint-report.json || true
          node -e "
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('eslint-report.json', 'utf8'));
            const hookIssues = results.flatMap(r => r.messages.filter(m => m.ruleId && m.ruleId.startsWith('react-hooks/')).map(m => ({ file: r.filePath, line: m.line, message: m.message })));
            if (hookIssues.length > 0) {
              console.error('React Hooks rule violations found:');
              console.error(JSON.stringify(hookIssues, null, 2));
              process.exit(1);
            }
            console.log('No react-hooks violations found.');
          "

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USER }}/${{ matrix.app }}
          tags: |
            type=sha,priority=610
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ matrix.app == 'recipes' && vars.CLERK_PUBLISHABLE_KEY || '' }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USER }}/${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USER }}/${{ matrix.app }}:buildcache,mode=max

      # Job-level `outputs:` are not matrix-aware: every leg writes to the same
      # output map, so parallel legs clobber each other. Each leg instead writes
      # its tag to its own artifact file, and the deploy job merges them.
      - name: Capture image tag
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mkdir -p image-tags
          TAG="$(echo "$META_JSON" | jq -r '.tags[0]')"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No image tag produced for ${{ matrix.app }}" >&2
            exit 1
          fi
          echo "$TAG" > "image-tags/${{ matrix.app }}.tag"

      - name: Upload image tag
        uses: actions/upload-artifact@v4
        with:
          name: image-tag-${{ matrix.app }}
          path: image-tags/${{ matrix.app }}.tag
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image tags
        uses: actions/download-artifact@v4
        with:
          pattern: image-tag-*
          merge-multiple: true
          path: image-tags

      - name: Read image tags
        id: tags
        run: |
          RECIPES_IMAGE="$(cat image-tags/recipes.tag)"
          RECIPES_API_IMAGE="$(cat image-tags/recipes-api.tag)"
          RECIPES_MCP_IMAGE="$(cat image-tags/recipes-mcp.tag)"
          echo "recipes_image=$RECIPES_IMAGE" >> "$GITHUB_OUTPUT"
          echo "recipes_api_image=$RECIPES_API_IMAGE" >> "$GITHUB_OUTPUT"
          echo "recipes_mcp_image=$RECIPES_MCP_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            server

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh workflow run -R IamTugy/server deploy-recipes.yaml \
            -f "recipes_image=${{ steps.tags.outputs.recipes_image }}" \
            -f "recipes_api_image=${{ steps.tags.outputs.recipes_api_image }}" \
            -f "recipes_mcp_image=${{ steps.tags.outputs.recipes_mcp_image }}"
