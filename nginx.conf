server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy to the recipes-api backend. The upstream host is held in a
    # variable so nginx resolves it at request time via the cluster DNS rather
    # than at config-load time - otherwise nginx refuses to start whenever the
    # recipes-api Service isn't resolvable yet, coupling frontend startup to
    # backend startup. 10.43.0.10 is the k3s/k3d CoreDNS ClusterIP.
    location /api/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        set $recipes_api "recipes-api.apps.svc.cluster.local";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$recipes_api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Link-preview crawlers (WhatsApp, iMessage, Slack, Twitter/X) fetch the
    # shared URL directly without running JS, so they need a server-rendered
    # page with per-recipe og:image/og:title - the SPA route below can't
    # serve that. See api/src/share/share.controller.ts.
    location /share/ {
        resolver 10.43.0.10 valid=30s ipv6=off;
        set $recipes_api "recipes-api.apps.svc.cluster.local";
        rewrite ^/share/(.*)$ /share/$1 break;
        proxy_pass http://$recipes_api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
